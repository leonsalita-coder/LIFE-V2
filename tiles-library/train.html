<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>Train</title>

<style>
  /* ====================================================================
     TRAIN — an instrument, not a card feed. One physics idea (momentum),
     one signal color used sparingly (mint — shared across the whole
     dashboard, kept for system coherence), a five-step elevation scale
     instead of flat panels, and numerals treated like an engraved dial.
     System fonts only — no external files, this renders in a sealed
     sandboxed iframe with no network. Every "expensive" cue here is
     built from restraint and craft, not borrowed assets.
     ================================================================= */
  :root {
    /* elevation — true-black base, five graphite steps up */
    --e0:#030304; --e1:#0a0a0d; --e2:#101013; --e3:#17171b; --e4:#1f1f24;
    --hair:rgba(255,255,255,.07); --hair-strong:rgba(255,255,255,.14);
    /* signal — scarce by design. gold flags a PR, fail flags a miss */
    --signal:#6EE7B7; --signal-ink:#04140d;
    --gold:#f5a623; --fail:#ef6f6a;
    --text:#f2f2f0; --muted:#86868f; --muted-2:#5c5c63;
    /* type — sans for UI, serif upright (never default-italic) for
       structural headings, mono for every numeral / data readout */
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;
    /* spacing ladder — 4/8/12/16/24/32/48/64/96 */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px; --sp8:64px; --sp9:96px;
    --r-sm:9px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    /* motion — one momentum family. out = ui settling; spring = tactile
       taps; cinematic = anything that takes over the screen */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-momentum:cubic-bezier(.2,.85,.25,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --d1:110ms; --d2:190ms; --d3:320ms; --d4:520ms; --d5:760ms;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--signal); color:var(--signal-ink); }
  html { background:var(--e0); }
  body { margin:0; min-height:100dvh; padding:0 0 calc(56px + env(safe-area-inset-bottom)); background:var(--e0); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  .num,.tab { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--signal); outline-offset:2px; border-radius:6px; }

  /* ==== SIGNAL FIELD — a live canvas node graph, replaces the old
     mountains svg. A sparse constellation drifts and occasionally
     threads a pulse between two nodes when data changes (see
     pulseSignalField()). Ambient, never distracting: low opacity,
     capped particle count, pauses under reduced-motion. ============ */
  #signalField { position:fixed; inset:0; z-index:-1; pointer-events:none; width:100%; height:100%; opacity:.55; }
  #signalField.paused { opacity:.28; }

  /* ==== STATUS RAIL — pinned telemetry strip, the spatial anchor the
     old design lacked (everything used to scroll away). ============ */
  .rail { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:var(--sp4); padding:calc(10px + env(safe-area-inset-top)) var(--sp5) 10px; background:linear-gradient(180deg, rgba(3,3,4,.92) 60%, rgba(3,3,4,0)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .railDate { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .railDivider { width:1px; height:14px; background:var(--hair-strong); flex:none; }
  .railStat { display:flex; align-items:baseline; gap:5px; flex:none; }
  .railStatVal { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }
  .railStatVal.lit { color:var(--signal); text-shadow:0 0 12px rgba(110,231,183,.5); }
  .railStatLbl { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); }
  .railSpacer { flex:1; }

  .shell { width:100%; max-width:600px; margin:0 auto; padding:0 var(--sp4); }
  .starterTag { width:max-content; max-width:92%; margin:var(--sp5) auto var(--sp5); padding:6px 14px; border:1px solid var(--hair-strong); border-radius:999px; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.6; }

  /* ==== PANELS — five-step elevation instead of flat glass cards.
     A hairline top-sheen (light source implied from above) is the only
     "glass" cue left; no heavy blur anywhere in static UI. ========== */
  .sheet { position:relative; width:100%; background:var(--e1); border:1px solid var(--hair); border-radius:var(--r-lg); padding:22px 20px 24px; margin-bottom:var(--sp4); opacity:0; transform:translateY(10px); animation:panelRise var(--d4) var(--ease-momentum) forwards; }
  .sheet::before { content:''; position:absolute; left:18px; right:18px; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent); }
  @keyframes panelRise { to { opacity:1; transform:none; } }
  .eyebrow { font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em; font-size:10.5px; font-weight:600; color:var(--muted); }
  .streakPill { font-family:var(--mono); font-size:10.5px; font-weight:700; color:var(--gold); background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.28); border-radius:999px; padding:4px 10px; display:none; letter-spacing:.02em; }

  .daydots { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:7px; margin-top:16px; min-height:8px; }
  .daydots .dd { width:6px; height:6px; border-radius:2px; border:1.5px solid var(--e4); transition:background var(--d2), border-color var(--d2); }
  .daydots .dd.done { background:var(--signal); border-color:var(--signal); }
  .daydots .dd.pr { background:var(--gold); border-color:var(--gold); }
  .daydots .dd.miss { border-color:var(--fail); }

  .dayhead { display:flex; align-items:flex-end; gap:12px; margin-top:14px; }
  .daytitle { font-family:var(--serif); font-style:normal; font-weight:500; font-size:32px; line-height:1; letter-spacing:-0.015em; }
  .moonbtn { margin-left:auto; align-self:center; margin-bottom:3px; display:inline-flex; align-items:center; gap:7px; background:var(--e2); border:1px solid var(--hair); color:var(--muted); border-radius:999px; padding:8px 13px; font-size:12px; font-weight:500; cursor:pointer; transition:color var(--d2) var(--ease-out), border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out), transform var(--d1) var(--spring); }
  .moonbtn:hover { color:var(--text); border-color:var(--hair-strong); }
  .moonbtn:active { transform:scale(.94); }
  .moonbtn.on { color:var(--signal); border-color:rgba(110,231,183,.4); background:rgba(110,231,183,.07); }
  .moonbtn svg { width:14px; height:14px; fill:currentColor; }

  /* ==== PROGRESS RULER — a tick-mark instrument, not a colored bar.
     Ticks light up left-to-right as sets log; a bright index line marks
     the live boundary. Built with a CSS mask, no per-tick DOM needed. */
  .progress { margin-top:20px; }
  .ruler { position:relative; height:20px; }
  .rulerTrack { position:absolute; inset:0; top:7px; height:6px; border-radius:3px; background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1.5px, transparent 1.5px calc(100%/38)); background-color:rgba(255,255,255,.03); }
  .rulerFill { position:absolute; inset:0; top:7px; height:6px; border-radius:3px 0 0 3px; overflow:hidden; width:0%; transition:width var(--d4) var(--ease-momentum); }
  .rulerFill::before { content:''; position:absolute; inset:0; width:10000%; background-image:repeating-linear-gradient(90deg, var(--signal) 0 1.5px, rgba(167,243,208,.65) 1.5px calc(100%/380)); }
  .rulerNeedle { position:absolute; top:0; width:2px; height:20px; background:#fff; border-radius:2px; box-shadow:0 0 10px 2px rgba(110,231,183,.85), 0 0 22px 6px rgba(110,231,183,.35); transform:translateX(-1px); transition:left var(--d4) var(--ease-momentum); }
  .rulerFill.pulse { animation:rulerPulse .6s var(--ease-out); }
  @keyframes rulerPulse { 0% { filter:brightness(1); } 35% { filter:brightness(1.5); } 100% { filter:brightness(1); } }
  .plabel { font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-top:12px; letter-spacing:.01em; }
  .plabel b { color:var(--text); font-weight:700; }
  .odo { display:inline-flex; }
  .odoDigit { display:inline-block; overflow:hidden; height:1em; vertical-align:top; }
  .odoDigit .odoReel { display:block; transition:transform var(--d4) var(--ease-momentum); }
  .odoDigit .odoReel span { display:block; height:1em; line-height:1; }

  /* ==== checklists ================================================ */
  .wcSection { margin-top:16px; }
  .wcSection:empty { display:none; }
  .wcHead { width:100%; display:flex; align-items:center; gap:8px; background:var(--e2); border:1px solid var(--hair); border-radius:12px; padding:11px 14px; cursor:pointer; color:var(--muted-2); font:inherit; transition:border-color var(--d2), background var(--d2); }
  .wcHead:hover { border-color:var(--hair-strong); }
  .wcCaret { color:var(--signal); font-size:11px; width:10px; }
  .wcTitle { font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--muted); }
  .wcCount { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted-2); }
  .wcBody { display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--d4) var(--ease-momentum); }
  .wcBody.open { grid-template-rows:1fr; }
  .wcBodyInner { overflow:hidden; min-height:0; padding:14px 4px 2px; opacity:0; transition:opacity var(--d3) var(--ease-out); }
  .wcBody.open .wcBodyInner { opacity:1; transition-delay:.1s; }
  .wcItem { display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .wcCheck { flex:none; width:21px; height:21px; border-radius:6px; border:1px solid var(--hair-strong); background:var(--e2); color:var(--signal); font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform var(--d1) var(--spring), background var(--d2), border-color var(--d2); }
  .wcCheck:active { transform:scale(.86); }
  .wcCheck.on { background:var(--signal); border-color:var(--signal); color:var(--signal-ink); }
  .wcTxt { flex:1; font-size:13.5px; color:var(--text); }
  .wcTxt.done { color:var(--muted); text-decoration:line-through; }
  .wcX { flex:none; background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 4px; transition:color var(--d2); }
  .wcX:hover { color:var(--fail); }
  .wcAdd { display:flex; gap:8px; margin-top:8px; }
  .wcIn { flex:1; background:var(--e2); border:1px solid var(--hair); border-radius:10px; color:var(--text); font:inherit; font-size:13px; padding:9px 11px; transition:border-color var(--d2); }
  .wcIn:focus { outline:none; border-color:var(--signal); }
  .wcAddBtn { background:var(--signal); color:var(--signal-ink); border:none; border-radius:10px; padding:0 15px; font-weight:700; cursor:pointer; transition:transform var(--d1) var(--spring); }
  .wcAddBtn:active { transform:scale(.94); }

  /* ==== EXERCISE CARDS — raised one elevation step, a hairline cursor
     light on hover (interaction-only, never idle-looping). =========== */
  .exwrap { margin-top:8px; display:flex; flex-direction:column; gap:2px; }
  .ex { position:relative; background:var(--e2); border:1px solid transparent; border-radius:var(--r-md); padding:18px 16px 20px; transition:background var(--d2) var(--ease-out); }
  .ex::after { content:''; position:absolute; inset:0; border-radius:var(--r-md); background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.08), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .ex:hover::after { opacity:1; }
  .ex > * { position:relative; z-index:1; }
  .ex.drag-ghost { opacity:.4; }
  .ex.celebrate::before { content:""; position:absolute; inset:-1px; border-radius:var(--r-md); pointer-events:none; z-index:0; animation:exGlow 1.6s var(--ease-out) forwards; }
  .ex.celebrate::after { opacity:1; border:1.5px solid rgba(245,166,35,.6); animation:exRing 1.6s var(--ease-out) forwards; }
  @keyframes exGlow { 0%{box-shadow:0 0 0 0 rgba(245,166,35,0);} 22%{box-shadow:0 0 52px -6px rgba(245,166,35,.5);} 100%{box-shadow:0 0 0 0 rgba(245,166,35,0);} }
  @keyframes exRing { 0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;} }

  .exHead { display:flex; align-items:center; gap:9px; }
  .grip { flex:none; width:20px; height:26px; display:grid; place-items:center; color:rgba(255,255,255,.2); cursor:grab; touch-action:none; background:none; border:none; padding:0; }
  .grip:hover { color:var(--muted); }
  .grip.dragging { cursor:grabbing; }
  .grip svg { width:14px; height:14px; fill:currentColor; }
  .exEye { flex:none; display:inline-flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--muted); width:26px; height:26px; transition:color var(--d2); }
  .exEye:hover { color:var(--signal); }
  .exEye svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; }
  .exName { font-family:var(--sans); font-weight:600; font-size:17px; line-height:1.2; letter-spacing:-0.01em; color:var(--text); flex:1; min-width:0; border:none; background:none; text-align:left; cursor:pointer; padding:0; display:inline-flex; align-items:baseline; gap:7px; word-break:break-word; }
  .exName:hover .nameTxt { text-decoration:underline; text-decoration-color:rgba(110,231,183,.5); text-underline-offset:3px; }
  .exInfo { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; font-family:var(--serif); font-size:11px; font-weight:600; color:var(--signal); background:rgba(110,231,183,.06); border:1px solid rgba(110,231,183,.25); border-radius:50%; line-height:1; align-self:center; flex:none; }
  .pinBtn { flex:none; background:none; border:none; cursor:pointer; color:rgba(255,255,255,.2); font-size:16px; line-height:1; padding:4px; transition:color var(--d2), transform var(--d1) var(--spring); }
  .pinBtn:hover { color:var(--muted); } .pinBtn:active { transform:scale(.85); }
  .pinBtn.on { color:var(--gold); }
  .menuBtn { flex:none; background:none; border:none; cursor:pointer; color:var(--muted); padding:5px 6px; border-radius:8px; transition:color var(--d2), background var(--d2); }
  .menuBtn:hover { color:var(--text); background:var(--e3); }
  .menuBtn svg { width:18px; height:18px; fill:currentColor; }

  .exMeta { font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding-left:29px; margin-top:11px; }
  .metaSep { opacity:.4; }
  .exNote { padding-left:29px; margin-top:9px; font-size:13px; color:var(--muted-2); display:flex; gap:7px; align-items:baseline; }
  .exNote .ndot { color:var(--signal); }
  .deloadTag { color:var(--muted-2); border:1px solid var(--hair-strong); border-radius:4px; padding:1px 6px; font-size:9px; letter-spacing:.1em; }
  .groupTag { color:var(--signal); border:1px solid rgba(110,231,183,.3); border-radius:4px; padding:1px 6px; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }

  .exActions { display:flex; align-items:center; flex-wrap:wrap; gap:7px; padding-left:29px; margin-top:14px; }
  .actionPill { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; font-size:12px; font-weight:500; color:var(--muted-2); background:var(--e3); border:1px solid var(--hair); border-radius:var(--r-pill); cursor:pointer; white-space:nowrap; transition:color var(--d2) var(--ease-out), border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out), transform var(--d1) var(--spring); }
  .actionPill:hover { color:var(--signal); border-color:rgba(110,231,183,.35); }
  .actionPill:active { transform:scale(.95); }
  .actionPill svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .actionPill .pl { font-family:var(--sans); letter-spacing:.01em; font-size:12.5px; }

  /* ==== SET PILLS — the countdown ledger. A left signal rail instead
     of a full-fill flood keeps "done" legible without going loud. === */
  .pills { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:16px; }
  .pill { display:flex; align-items:center; gap:11px; padding:12px 14px 12px 16px; border-radius:12px; border:1px solid var(--hair); border-left:2px solid var(--hair-strong); background:var(--e3); position:relative; overflow:hidden; transition:background var(--d3) var(--ease-out), border-color var(--d3) var(--ease-out), box-shadow var(--d3) var(--ease-out); }
  .pill.tappable { cursor:pointer; }
  .pill.tappable:hover { background:var(--e4); }
  .pillIdx { font-family:var(--mono); font-size:11px; color:var(--muted); width:14px; flex:none; }
  .pillValue { font-family:var(--mono); font-size:16px; letter-spacing:-0.01em; font-weight:600; display:inline-flex; align-items:baseline; }
  .pillTimes { color:var(--muted); margin:0 6px; font-weight:400; }
  .pillUnit { color:var(--muted); font-family:var(--sans); font-size:.62em; margin-left:3px; letter-spacing:.02em; font-variant-numeric:normal; text-transform:uppercase; }
  .pillPerHand { margin-left:1px; font-size:.85em; opacity:.7; }
  .pillInput { background:transparent; border:none; outline:none; color:inherit; font:inherit; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; -moz-appearance:textfield; appearance:textfield; min-width:2.4ch; width:4.2ch; padding:0 1px; border-bottom:1px solid transparent; transition:border-color var(--d2), color var(--d2); }
  .pillInput.r { width:2.6ch; }
  .pillInput::-webkit-outer-spin-button, .pillInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .pill:hover .pillInput { border-bottom-color:rgba(110,231,183,.25); }
  .pillInput:focus { color:var(--signal); border-bottom-color:var(--signal); }
  .pillInput.w.bump { color:var(--signal); }
  .pillSpacer { flex:1; }
  .pillActions { display:inline-flex; align-items:center; gap:10px; }
  .pillHit { background:var(--signal); color:var(--signal-ink); border:none; font-family:var(--sans); font-weight:700; font-size:12.5px; border-radius:var(--r-pill); padding:7px 13px; cursor:pointer; white-space:nowrap; transition:transform var(--d1) var(--spring), box-shadow var(--d2); box-shadow:0 4px 14px -6px rgba(110,231,183,.6); }
  .pillHit:hover { box-shadow:0 6px 18px -6px rgba(110,231,183,.75); } .pillHit:active { transform:scale(.94); }
  .pillMiss { background:none; border:none; font-family:var(--sans); font-size:12.5px; font-weight:500; color:var(--muted); cursor:pointer; padding:6px; transition:color var(--d2); }
  .pillMiss:hover { color:var(--fail); }
  .pillStatus { font-family:var(--mono); font-size:12.5px; cursor:default; color:var(--muted); }
  .pillPr { font-weight:700; color:var(--gold); }
  .pillDrop { background:none; border:1px solid var(--hair-strong); font-family:var(--sans); font-size:11.5px; font-weight:500; color:var(--signal); cursor:pointer; padding:5px 9px; border-radius:var(--r-pill); white-space:nowrap; transition:border-color var(--d2), background var(--d2); }
  .pillDrop:hover { background:rgba(110,231,183,.08); border-color:rgba(110,231,183,.4); }
  .pillWrap { display:flex; flex-direction:column; gap:6px; }
  .drops:empty { display:none; }
  .dropRow { display:flex; align-items:center; gap:9px; padding:9px 14px 9px 28px; margin-left:8px; border-left:2px solid var(--hair-strong); font-size:13px; }
  .dropArrow { color:var(--muted); font-size:12px; }
  .pillInput.small { font-size:.85em; }
  .dropX { background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:2px 4px; margin-left:auto; transition:color var(--d2); }
  .dropX:hover { color:var(--fail); }
  .pillReset { background:none; border:none; cursor:pointer; padding:6px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); opacity:.7; transition:opacity var(--d2), background var(--d2); }
  .pillReset svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .pillReset:hover { opacity:1; background:var(--e4); }
  .pill.done { background:rgba(110,231,183,.07); border-color:rgba(110,231,183,.25); border-left-color:var(--signal); }
  .pill.done .pillValue, .pill.done .pillInput { color:var(--signal); }
  .pill.done .pillHit { display:none; }
  .pill.failed { background:rgba(239,111,106,.06); border-color:rgba(239,111,106,.25); border-left-color:var(--fail); }
  .pill.failed .pillIdx, .pill.failed .pillStatus { color:var(--fail); }
  .pill.failed .pillValue { text-decoration:line-through; color:var(--muted-2); }
  .pill.shimmer { animation:pillSnap .32s var(--spring); }
  .pill.shimmer::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform:translateX(-120%); animation:pillShimmer .8s var(--ease-out); }
  @keyframes pillShimmer { to { transform:translateX(120%); } }
  @keyframes pillSnap { 0%{transform:scale(1);} 40%{transform:scale(1.014);} 100%{transform:scale(1);} }

  .ex.collapsed .exMeta, .ex.collapsed .exActions, .ex.collapsed .pills, .ex.collapsed .exNote, .ex.collapsed .restSlot { display:none; }
  .ex.collapsed .collapsedNote { display:flex; }
  .collapsedNote { display:none; padding-left:29px; margin-top:8px; font-size:12px; color:var(--muted); }

  /* ==== REST RING — a draining radial instrument ==================== */
  .restSlot:empty { display:none; }
  .restbar { display:flex; align-items:center; justify-content:center; gap:13px; margin-top:16px; margin-left:29px; padding:9px 14px; border:1px solid rgba(110,231,183,.3); border-radius:999px; background:rgba(110,231,183,.05); }
  .restbar.over { border-color:rgba(245,166,35,.5); background:rgba(245,166,35,.06); }
  .restStep { background:var(--e3); border:1px solid var(--hair); color:var(--text); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:12px; font-family:var(--mono); font-variant-numeric:tabular-nums; transition:border-color var(--d2); }

  .restMid { text-align:center; min-width:108px; position:relative; z-index:1; }
  .restTime { font-family:var(--mono); font-weight:700; font-size:18px; color:var(--signal); font-variant-numeric:tabular-nums; letter-spacing:-0.01em; position:relative; z-index:1; }
  .restbar.over .restTime { color:var(--gold); }
  .restLabel { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:1px; position:relative; z-index:1; }

  .restRingTrack { fill:none; stroke:rgba(255,255,255,.08); stroke-width:2.5; }
  .restRingFill { fill:none; stroke:var(--signal); stroke-width:2.5; stroke-linecap:round; transition:stroke-dashoffset .3s linear, stroke var(--d2); filter:drop-shadow(0 0 4px rgba(110,231,183,.5)); }
  .restbar.over .restRingFill { stroke:var(--gold); filter:drop-shadow(0 0 6px rgba(245,166,35,.55)); }
  .restbar.over .restMid { animation:restOverPulse 1s var(--ease-out) infinite; }
  @keyframes restOverPulse { 0%,100%{opacity:1;} 50%{opacity:.7;} }
  .restX { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:2px 5px; }
  .restX:hover { color:var(--text); }

  /* ==== add-lift / rest day / finish ================================ */
  .addLift { display:flex; flex-direction:column; align-items:center; gap:10px; margin:8px auto 0; background:none; border:none; cursor:pointer; padding:18px; width:100%; }
  .addLiftRing { width:42px; height:42px; border-radius:50%; border:1px solid rgba(110,231,183,.4); display:grid; place-items:center; color:var(--signal); transition:background var(--d2), transform var(--d1) var(--spring), box-shadow var(--d3); }
  .addLift:hover .addLiftRing { background:rgba(110,231,183,.08); box-shadow:0 0 0 6px rgba(110,231,183,.05); }
  .addLift:active .addLiftRing { transform:scale(.92); }
  .addLiftRing svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; }
  .addLiftLabel { font-family:var(--sans); font-weight:600; font-size:14px; color:var(--signal); }

  .restPanel { text-align:center; padding:38px 16px 30px; }
  .restPanel .moon { width:44px; height:44px; margin:0 auto; color:var(--muted); }
  .restPanel .moon svg { width:100%; height:100%; fill:currentColor; }
  .restPanel h3 { font-family:var(--serif); font-weight:500; font-size:25px; margin:16px 0 0; }
  .restPanel p { font-size:14px; line-height:1.6; color:var(--muted-2); max-width:340px; margin:12px auto 0; }
  .restPanel .undo { margin-top:18px; background:none; border:none; color:var(--signal); font-weight:600; font-size:14px; cursor:pointer; }

  .finishRow { margin-top:22px; }
  .finishBtn { width:100%; border:none; border-radius:var(--r-md); padding:16px; font-family:var(--sans); font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 46%), var(--signal); color:var(--signal-ink); box-shadow:0 14px 34px -14px rgba(110,231,183,.55); transition:transform var(--d1) var(--spring), box-shadow var(--d2) var(--ease-out), opacity var(--d2), background var(--d2); }
  .finishBtn:hover:not(:disabled) { box-shadow:0 18px 42px -12px rgba(110,231,183,.65); transform:translateY(-1px); }
  .finishBtn:active:not(:disabled) { transform:scale(.99); }
  .finishBtn:disabled { opacity:.35; cursor:default; box-shadow:none; }
  .finishBtn.locked { background:rgba(110,231,183,.1); color:var(--signal); border:1px solid rgba(110,231,183,.4); box-shadow:none; }
  .freshbtn { display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:12.5px; font-weight:500; cursor:pointer; padding:8px 12px; border-radius:9px; transition:color var(--d2); }
  .freshbtn:hover { color:var(--text); } .freshbtn.arm { color:var(--fail); font-weight:600; }
  .store-note { text-align:center; color:var(--muted-2); font-size:11px; font-weight:500; margin-top:8px; }

  .goalPill { width:100%; text-align:left; background:var(--e2); border:1px solid var(--hair); color:var(--text); border-radius:var(--r-md); padding:15px 16px; font-family:var(--sans); font-size:14.5px; font-weight:500; cursor:pointer; transition:border-color var(--d2), background var(--d2); }
  .goalPill:hover { border-color:rgba(110,231,183,.35); background:rgba(110,231,183,.03); }
  .goalPill.empty { color:var(--muted); font-weight:400; }

  /* ==== progress photos ============================================ */
  .photoCard { position:relative; border:1px solid var(--hair); border-radius:var(--r-md); overflow:hidden; margin-bottom:14px; background:var(--e2); transition:transform var(--d2) var(--ease-out), box-shadow var(--d2) var(--ease-out); }
  .photoCard::after { content:''; position:absolute; inset:0; border-radius:var(--r-md); background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.08), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .photoCard:hover::after { opacity:1; }
  .photoCard:hover { transform:translateY(-2px); box-shadow:0 16px 36px -18px rgba(0,0,0,.7); }
  .photoImg { width:100%; display:block; max-height:440px; object-fit:cover; background:var(--e3); position:relative; z-index:1; }
  .photoMeta { display:flex; align-items:center; justify-content:space-between; padding:11px 14px; position:relative; z-index:1; }
  .photoDate { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .photoX { background:none; border:none; color:var(--muted); font-size:17px; cursor:pointer; padding:2px 6px; line-height:1; transition:color var(--d2); }
  .photoX:hover { color:var(--fail); }
  .photoNote { padding:0 14px 16px; font-size:13.5px; color:var(--text); line-height:1.55; position:relative; z-index:1; }
  .photoNote.muted { color:var(--muted); font-size:12.5px; }
  .photoStatus { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; min-height:14px; }

  .chipRow { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin:16px -2px 0; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .chipRow::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:9px 16px; border-radius:999px; border:1px solid var(--hair); background:var(--e2); color:var(--muted-2); font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:border-color var(--d2) var(--ease-out), background var(--d2) var(--ease-out), color var(--d2) var(--ease-out), transform var(--d1) var(--spring); }
  .chip:hover { border-color:var(--hair-strong); color:var(--text); }
  .chip:active { transform:scale(.94); }
  .chip.on { border-color:var(--signal); background:var(--signal); color:var(--signal-ink); }
  .cal { display:flex; flex-wrap:wrap; gap:5px; padding:6px 2px; }
  .cal .cd { width:13px; height:13px; border-radius:3px; background:var(--e2); border:1px solid var(--hair); }
  .cal .cd.on { background:var(--signal); border-color:var(--signal); }
  .cal .cd.off { background:rgba(239,111,106,.28); border-color:var(--fail); }
  .photoBtnRow { display:flex; gap:10px; }
  .photoBtnRow .addLift { flex:1; }
  .ovGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; }
  .ovCard { position:relative; overflow:hidden; border:1px solid var(--hair); background:var(--e2); border-radius:var(--r-md); padding:16px 12px; text-align:center; transition:border-color var(--d2) var(--ease-out), transform var(--d2) var(--ease-out); }
  .ovCard::after { content:''; position:absolute; inset:0; background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(110,231,183,.1), transparent 65%); opacity:0; transition:opacity var(--d3) var(--ease-out); pointer-events:none; }
  .ovCard:hover::after { opacity:1; }
  .ovCard:hover { border-color:var(--hair-strong); transform:translateY(-1px); }
  .ovNum { position:relative; z-index:1; font-family:var(--mono); font-size:24px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
  .ovNum.gold { color:var(--gold); }
  .ovNum.mint { color:var(--signal); }
  .ovLbl { position:relative; z-index:1; font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
  .wdBars { display:flex; gap:8px; margin-top:18px; align-items:flex-end; height:72px; }
  .wdBar { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; }
  .wdTrack { flex:1; width:100%; display:flex; align-items:flex-end; }
  .wdFill { width:100%; background:linear-gradient(180deg, rgba(167,243,208,.9), var(--signal)); border-radius:4px 4px 0 0; min-height:2px; box-shadow:0 0 8px rgba(110,231,183,.25); transition:height var(--d4) var(--ease-momentum); }
  .wdLbl { font-family:var(--mono); font-size:9px; color:var(--muted); text-transform:uppercase; }
  .muscleBars { display:flex; flex-direction:column; gap:11px; padding:4px 2px; }
  .mbRow { display:flex; align-items:center; gap:10px; }
  .mbLbl { width:88px; flex:none; font-size:12px; color:var(--muted-2); text-transform:capitalize; }
  .mbTrack { flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.05); overflow:hidden; }
  .mbFill { height:100%; background:linear-gradient(90deg, var(--signal), #d7fbe9); border-radius:999px; box-shadow:0 0 8px rgba(110,231,183,.28); transition:width var(--d4) var(--ease-momentum); }
  .mbVal { width:56px; flex:none; text-align:right; font-family:var(--mono); font-size:11px; color:var(--muted); }
  .goalRow { position:relative; padding:12px 34px 14px 0; border-bottom:1px solid var(--hair); }
  .goalRow:last-of-type { border-bottom:none; }
  .goalTop { display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:9px; }
  .goalRow .photoX { position:absolute; right:0; top:8px; }
  .insightBox { margin-top:14px; padding:14px 16px; background:rgba(110,231,183,.05); border:1px solid rgba(110,231,183,.18); border-radius:var(--r-md); text-align:left; font-size:13.5px; color:var(--text); line-height:1.55; }

  /* ==== popups ====================================================== */
  .scrim { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:max(20px, env(safe-area-inset-top)) 14px 40px; overflow-y:auto; background:rgba(0,0,0,.5); backdrop-filter:blur(0px); opacity:0; animation:scrimIn var(--d3) var(--ease-momentum) forwards; }
  @keyframes scrimIn { to { opacity:1; backdrop-filter:blur(6px); } }
  .pop { width:100%; max-width:520px; margin:auto; background:var(--e2); border:1px solid var(--hair-strong); border-radius:var(--r-lg); padding:24px 22px 26px; position:relative; box-shadow:0 40px 100px rgba(0,0,0,.65); opacity:0; transform:translateY(10px) scale(.97); animation:popIn var(--d4) var(--ease-momentum) forwards; }
  @keyframes popIn { to { opacity:1; transform:none; } }
  .pop::before { content:''; position:absolute; left:16px; right:16px; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); }
  .popHead { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .popTitle { font-family:var(--serif); font-weight:500; font-size:26px; line-height:1.1; letter-spacing:-0.01em; margin-top:6px; }
  .popX { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; flex:none; transition:color var(--d2); }
  .popX svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .popX:hover { color:var(--text); }

  .range { display:flex; gap:3px; justify-content:center; background:var(--e1); border:1px solid var(--hair); border-radius:12px; padding:4px; margin:20px auto 0; width:fit-content; }
  .range button { background:none; border:none; color:var(--muted); font-family:var(--sans); font-size:13px; font-weight:600; padding:8px 14px; border-radius:9px; cursor:pointer; transition:color var(--d2), background var(--d3); }
  .range button.on { background:var(--signal); color:var(--signal-ink); }
  .chart-card { margin-top:18px; border:1px solid var(--hair); border-radius:var(--r-lg); padding:18px 16px 14px; background:var(--e1); }
  .plot { position:relative; width:100%; aspect-ratio:600/240; }
  .plot svg { width:100%; height:100%; display:block; overflow:visible; }
  .grid { stroke:var(--hair); stroke-width:1; }
  .axis-label,.xlab { fill:var(--muted); font-family:var(--mono); font-size:10.5px; }
  .xlab.best { fill:var(--signal); font-weight:500; }
  .area { fill:url(#fill); }
  .line { fill:none; stroke:var(--signal); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .dot { fill:var(--signal); stroke:var(--e1); stroke-width:3; }
  .dot.best { fill:var(--gold); }
  .dot.off { fill:var(--muted); }
  .delta-cap { text-align:center; font-family:var(--mono); font-weight:700; font-size:14px; color:var(--signal); margin-top:8px; font-variant-numeric:tabular-nums; }
  .delta-cap .mu { color:var(--muted); }
  .stats { display:flex; margin-top:20px; padding-top:18px; border-top:1px solid var(--hair); }
  .stat { flex:1; text-align:center; }
  .stat .k { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .stat .v { font-family:var(--mono); font-size:20px; font-weight:700; margin-top:8px; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .stat .v.up { color:var(--signal); } .stat .v.gold { color:var(--gold); }
  table.hist { width:100%; border-collapse:collapse; margin-top:22px; }
  table.hist th { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:0 0 13px; text-align:right; }
  table.hist th:first-child { text-align:left; }
  table.hist td { font-family:var(--mono); font-size:13.5px; font-weight:500; padding:12px 0; text-align:right; border-top:1px solid var(--hair); }
  table.hist td:first-child { text-align:left; color:var(--muted); font-family:var(--sans); font-weight:500; }
  table.hist td .num { font-weight:700; } table.hist td .u { font-size:11px; color:var(--muted); font-weight:500; }
  table.hist td.prog { color:var(--signal); } table.hist td.prog.first { color:var(--muted); }
  .best-w { color:var(--gold); display:inline-flex; align-items:center; gap:5px; justify-content:flex-end; }
  .best-w svg { width:12px; height:12px; fill:var(--gold); }
  .emptyHist { text-align:center; color:var(--muted); padding:34px 0; font-family:var(--sans); font-size:14px; }

  .formMuscles { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
  .formMuscles .primary { color:var(--signal); } .formMuscles .secondary { color:var(--muted-2); }
  .formEquip { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px; }
  .formGist { font-size:16px; font-weight:500; line-height:1.4; margin:18px 0 0; }
  .formSteps { display:flex; flex-direction:column; gap:13px; margin-top:18px; }
  .formStep { display:flex; gap:15px; align-items:baseline; }
  .formStep .n { font-family:var(--mono); font-size:12px; color:var(--signal); width:22px; flex:none; }
  .formStep .t { font-size:14.5px; font-weight:500; line-height:1.45; }
  .formCues { display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }
  .cuePill { border:1px solid var(--hair-strong); border-radius:999px; padding:8px 15px; color:var(--muted-2); font-size:13px; }

  .secLbl { font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:20px 0 10px; }
  .swapList { display:flex; flex-direction:column; gap:8px; }
  .swapItem { display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--hair); border-radius:13px; background:var(--e1); cursor:pointer; text-align:left; transition:border-color var(--d2) var(--ease-out), transform var(--d2) var(--ease-out); width:100%; color:inherit; }
  .swapItem:hover { border-color:rgba(110,231,183,.35); transform:translateY(-1px); }
  .swapItem .nm { font-family:var(--sans); font-weight:600; font-size:15px; }
  .swapItem .mu { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .swapItem .arr { margin-left:auto; color:var(--muted); } .swapItem:hover .arr { color:var(--signal); }
  .swapItem .arr svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .searchRow { display:flex; align-items:center; gap:10px; border:1px solid var(--hair-strong); border-radius:12px; padding:11px 13px; background:var(--e1); }
  .searchRow svg { width:16px; height:16px; fill:none; stroke:var(--muted); stroke-width:1.6; flex:none; }
  .searchRow input { flex:1; background:none; border:none; outline:none; color:var(--text); font:inherit; font-size:15px; }

  .field { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--hair); }
  .field:last-of-type { border-bottom:none; }
  .field .lbl { color:var(--muted-2); font-size:14px; font-weight:500; display:flex; align-items:center; gap:10px; }
  .field .lbl svg { width:18px; height:18px; fill:none; stroke:var(--muted); stroke-width:1.5; }
  .stepper { display:flex; align-items:center; gap:14px; }
  .step { width:36px; height:36px; border-radius:10px; border:1px solid var(--hair-strong); background:var(--e1); color:var(--text); font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform var(--d1) var(--spring), border-color var(--d2); }
  .step:hover { border-color:var(--signal); } .step:active { transform:scale(.9); } .step.minus { color:var(--muted); }
  .stepVal { min-width:58px; text-align:center; font-family:var(--mono); font-size:19px; font-variant-numeric:tabular-nums; font-weight:600; }
  .wInput { font-family:var(--mono); font-weight:600; font-size:19px; width:90px; text-align:right; background:none; border:none; color:inherit; border-bottom:1px solid transparent; -moz-appearance:textfield; appearance:textfield; }
  .wInput:focus { outline:none; border-bottom-color:var(--signal); color:var(--signal); }
  .wInput::-webkit-outer-spin-button, .wInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .wUnit { color:var(--muted); font-size:14px; margin-left:6px; }
  .popBtns { display:flex; gap:10px; margin-top:24px; }
  .pbtn { flex:1; border:none; border-radius:var(--r-md); padding:14px; font-family:var(--sans); font-size:14.5px; font-weight:700; cursor:pointer; transition:transform var(--d1) var(--spring); }
  .pbtn:active { transform:scale(.98); }
  .pbtn.save { background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 46%), var(--signal); color:var(--signal-ink); box-shadow:0 10px 26px -14px rgba(110,231,183,.5); }
  .pbtn.save:hover:not(:disabled) { box-shadow:0 14px 34px -12px rgba(110,231,183,.6); }
  .pbtn.ghost { background:var(--e1); border:1px solid var(--hair-strong); color:var(--muted); }
  .pbtn.ghost:hover { color:var(--text); border-color:var(--muted); }
  .pbtn.danger { background:rgba(239,111,106,.1); border:1px solid var(--fail); color:#f4a09c; }
  .pbtn:disabled { opacity:.4; cursor:default; }

<script>
/* ====================================================================
   THE LOGGER. One session per real calendar day — no fixed splits, no
   pre-filled program. Content only arrives by generating with the coach,
   typing an exercise for the AI to classify, or loading a saved template.
   ================================================================= */

/* ---- date helpers (local time, never toISOString) ------------------ */
const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function getLocalDateKey(d=new Date()){ return ymd(d); }
const today = getLocalDateKey();
function fmtDate(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDayTitle(){ const [y,m,d]=today.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); }
function daysAgo(k){ const [y,m,d]=k.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((t-new Date(y,m-1,d))/DAY); }
const r1 = n => Math.round(n*10)/10;
const ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x'];
function mmss(s){ return Math.floor(s/60)+':'+pad(s%60); }
const TIER_LABEL = { 1:'tier 1', 2:'tier 2', 3:'tier 3' };
/* ---- the athlete's goal (written here by the mentor, same as weights.ts) - */
const ATHLETE_GOAL = 'Become a peak athlete in taekwondo and soccer';
/** Long-term goal + whatever short-term goal is currently set, combined for
 *  every AI call — so a short-term focus actually shapes advice instead of
 *  being cosmetic. */
function fullGoalContext(){
  const g=(STATE.shortTermGoal||'').trim();
  return g ? ATHLETE_GOAL+'. Right now, short-term focus: '+g : ATHLETE_GOAL;
}

/* ---- build / load state ---------------------------------------------
   ONE session, keyed by today's real date — rolls over to a fresh, empty
   session automatically at midnight. Per-exercise history lives globally
   (STATE.history, keyed by exercise id) so it survives being removed from
   a session or regenerated on a different day. Nothing is ever pre-filled;
   content only arrives via generate, typing a name for the AI, or a saved
   template. */
function buildState(){
  return {
    unit:'lb', submitted:false,
    session:{ date:today, off:false, warmup:[], cooldown:[], ex:[] },
    history:{}, customLib:{}, finishedDates:[], templates:[], deloadOverrides:{},
    exerciseNames:{}, shortTermGoal:'', photos:[], sessionDurations:[], liftGoals:[]
  };
}
function seedChecklist(list){ return (list||[]).map(text=>({text, done:false})); }
/* ---- streak: consecutive days a session was finished --------------- */
function currentStreak(){
  const set=new Set(STATE.finishedDates||[]);
  let n=0, d=new Date();
  if(!set.has(ymd(d))) d.setDate(d.getDate()-1);
  while(set.has(ymd(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
/* ---- AI-classified exercises (typed by name, or from the coach) -----
   Cached in STATE.customLib so a name is only ever sent to the model
   once — it's a real paid call on the user's own key. */
function slugify(name){
  const base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'exercise';
  let id = base, n = 1;
  const taken = id2 => (STATE.customLib && STATE.customLib[id2]) || curSession().ex.some(x=>x.id===id2);
  while (taken(id)) { id = base + '_' + (++n); }
  return id;
}
function slugifyAvoiding(name, usedSet){
  const base = String(name).toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'exercise';
  let id=base, n=1;
  while ((STATE.customLib && STATE.customLib[id]) || usedSet.has(id)) { id = base+'_'+(++n); }
  return id;
}
/* ---- global per-exercise history, independent of any one session --- */
function histFor(e){ STATE.history=STATE.history||{}; return STATE.history[e.id]||(STATE.history[e.id]=[]); }
function lastKgFromHistory(id){
  const h=(STATE.history&&STATE.history[id])||[]; const real=h.filter(s=>!s.off);
  return real.length? real[real.length-1].kg : null;
}
/* STATE is filled by the async boot below once the dashboard bridge resolves. */
let STATE = null;
/* Fire-and-forget persistence through the dashboard bridge (no device storage). */
function saveState(){ if(window.Vitality && typeof window.Vitality.save==='function') window.Vitality.save(STATE); }

/* ---- helpers on state -------------------------------------------- */
function curSession(){
  if(!STATE.session || STATE.session.date!==today){
    Object.keys(restTimers).forEach(stopRest);
    STATE.session = { date:today, off:false, warmup:[], cooldown:[], ex:[] };
  }
  return STATE.session;
}
function sortedEx(session){ return session.ex.map((e,i)=>({e,i})).sort((a,b)=> (b.e.pinned-a.e.pinned)).map(o=>o.e); }
function prescription(e){ const kg = e.deload ? r1(e.kg*0.9) : e.kg; return { kg, reps:e.reps, sets:e.sets, rest:e.rest }; }
function classifySet(e, idx){ const s=e.log[idx]; if(!s) return 'empty'; if(s.fail) return 'failed'; return 'done'; }
function bestKgExclToday(e){ const real=histFor(e).filter(s=>!s.off && s.date!==today); return real.length? Math.max(...real.map(s=>s.kg)) : 0; }
function bestRepsAt(e, kg){ const real=histFor(e).filter(s=>!s.off && s.kg===kg); let m=0; real.forEach(s=>{ const t=Math.max(...s.sets.filter(x=>!x.fail).map(x=>x.r||0),0); if(t>m)m=t; }); return m; }
function isPR(e, idx){ const s=e.log[idx]; if(!s||s.fail) return false; const pb=bestKgExclToday(e); if(pb<=0) return false; if(s.kg>pb) return true; if(s.kg===pb && s.reps>bestRepsAt(e,pb)) return true; return false; }
function exDoneCount(e){ return e.log.filter(s=>s&&!s.fail).length; }
function exComplete(e){ return e.log.length>0 && e.log.every(s=>s&&!s.fail); }
function exHasPR(e){ return e.log.some((s,i)=>isPR(e,i)); }
function exHasMiss(e){ return e.log.some(s=>s&&s.fail); }
function sessionTotals(session){ if(session.off) return {logged:0,total:0}; let logged=0,total=0; session.ex.forEach(e=>{ total+=e.log.length; logged+=e.log.filter(s=>s).length; }); return {logged,total}; }

/* ====================================================================
   RENDER
   ================================================================= */
const $ = s => document.querySelector(s);
function svg(p,extra){ return '<svg viewBox="0 0 24 24"'+(extra||'')+'>'+p+'</svg>'; }
/* ---- button feedback: loading spinner → success check, via [data-state] */
function setBtnState(btn, state){ if(!btn) return; if(state) btn.dataset.state=state; else delete btn.dataset.state; }
function pulseSuccess(btn, ms){ setBtnState(btn,'success'); setTimeout(()=>setBtnState(btn,null), ms||900); }
const IC = {
  swap:'<path d="M4 7h13M14 4l3 3-3 3M20 17H7M10 14l-3 3 3 3"/>',
  history:'<path d="M3 17l5-5 4 4 8-8M16 8h5v5"/>',
  tune:'<path d="M4 7h16M4 17h16"/><circle cx="15" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="9" cy="17" r="2.2" fill="currentColor" stroke="none"/>',
  eyeOpen:'<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4 4M9.9 5.2A9.8 9.8 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.2 4M6.1 6.1A17 17 0 0 0 1.5 12S5 19 12 19a9.7 9.7 0 0 0 3.9-.8"/>',
  reset:'<path d="M3.5 6.5 A6 6 0 1 0 6 3.2"/><polyline points="2.4 2.4 3.7 6.6 8 5.2"/>',

/* ---- odometer: numbers count instead of snapping — a cheap, robust
   version of a digit-reel (interpolated text, tabular-nums keeps it
   from jittering in width). Skips the animation on first paint. ----- */
function countTo(el, value){
  const prev=el.dataset.val!=null ? Number(el.dataset.val) : null;
  el.dataset.val=String(value);
  el.classList.add('num');
  if(prev===null || prev===value || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ el.textContent=String(value); return; }
  const start=performance.now(), dur=520;
  function tick(t){
    const p=Math.min(1,(t-start)/dur); const eased=1-Math.pow(1-p,3);
    el.textContent=String(Math.round(prev+(value-prev)*eased));
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---- plateau detection: deterministic, computed here (not left to the
   AI to eyeball from a text dump) — weight AND reps both flat-or-down
   across the last WINDOW real sessions. Needs one extra session beyond
   the window so a plateau is never called from someone's very first
   few times logging a lift. */
function detectPlateau(e){
  const WINDOW=3;
  const h=histFor(e).filter(s=>!s.off);
  if(h.length<WINDOW+1) return null;
  const recent=h.slice(-WINDOW);
  const weights=recent.map(s=>s.kg);
  const flatOrDown=weights.every((w,i)=> i===0 || w<=weights[i-1]);
  const topReps=s=>Math.max(0,...(s.sets||[]).filter(x=>!x.fail).map(x=>x.r||0));
  const reps=recent.map(topReps);
  const repsFlatOrDown=reps.every((r,i)=> i===0 || r<=reps[i-1]);
  if(flatOrDown && repsFlatOrDown) return { sessions:WINDOW, weight:weights[weights.length-1] };
  return null;
}
/* ---- recovery cross-reference: Vitals is a whitelisted cross-tile read
   (window.Vitality.read), same recovery formula Vitals itself uses
   (whoopRecovery wins; else 0.6·feel + 0.4·sleep-scaled). Averaged over
   the last week so one bad night doesn't skew it. */
function vitalsRecoverySignal(v){
  if(!v || typeof v!=='object') return null;
  const dates=Object.keys(v).sort().slice(-7);
  if(!dates.length) return null;
  const scores=dates.map(k=>{
    const d=v[k]||{};
    if(typeof d.whoopRecovery==='number') return Math.max(1,Math.min(99,Math.round(d.whoopRecovery)));
    const parts=[], w=[];
    if(typeof d.feel==='number'){ parts.push(Math.max(0,Math.min(100,d.feel))); w.push(0.6); }
    if(typeof d.sleepHours==='number'){ parts.push(Math.max(0,Math.min(1,d.sleepHours/8))*100); w.push(0.4); }
    if(!parts.length) return null;
    const tw=w.reduce((a,b)=>a+b,0);
    return Math.round(parts.reduce((a,p,i)=>a+p*w[i],0)/tw);
  }).filter(n=>n!=null);
  if(!scores.length) return null;
  return { avg:Math.round(scores.reduce((a,b)=>a+b,0)/scores.length), days:scores.length };
}
/* ---- post-session note: one honest observation, computed once per
   finished session and cached — this is the mentor's "noticer" role,
   automated for Train. Silent on failure; it's a bonus, not core flow. */
const RECOVERY_FLOOR=55; // below this, a plateau is treated as fatigue-driven, not a programming problem
async function buildInsightContext(session){
  const lines=[];
  lines.push('Streak: '+currentStreak()+' consecutive day(s).');
  const t=sessionTotals(session);
  lines.push('Today: '+t.logged+'/'+t.total+' sets logged across '+session.ex.length+' exercise(s).');
  const plateaus=[];
  session.ex.forEach(e=>{
    const h=histFor(e).filter(s=>!s.off);
    const misses=e.log.filter(s=>s&&s.fail).length;
    const pr=exHasPR(e)?' (PR today)':'';
    const plateau=detectPlateau(e);
    if(plateau) plateaus.push({ e, plateau });
    if(h.length>=2){
      const delta=r1(h[h.length-1].kg-h[0].kg);
      lines.push('- '+e.name+': '+h.length+' sessions on record, '+(delta>=0?'+':'')+delta+' '+STATE.unit+' over that span, '+misses+' missed set(s) today'+pr+(plateau?' — PLATEAU: weight and reps flat for the last '+plateau.sessions+' sessions at '+plateau.weight+' '+STATE.unit+'.':'.'));
    } else {
      lines.push('- '+e.name+': first time logging this, '+misses+' missed set(s) today'+pr+'.');
    }
  });
  let recoveryAvg=null;
  try{
    const vitals=await window.Vitality.read('vitals');
    const rec=vitalsRecoverySignal(vitals);
    if(rec){ recoveryAvg=rec.avg; lines.push('Recovery (Vitals, '+rec.days+'-day avg): '+rec.avg+'/100.'); }
  }catch(e){ /* Vitals not available — the note still works without it */ }
  return { lines, plateaus, recoveryAvg };
}
/* ---- fully automatic deload: no button, no confirmation. When a lift is
   BOTH plateaued and recovery is genuinely low, this is fatigue, not a
   programming problem — so the system drops that lift's suggested weight
   ~12% right now, the same way the progression suggestion already
   auto-adjusts without asking. The note then REPORTS the action (never
   silent), and it's a one-time nudge: the very next real session on that
   lift clears the override and normal progression resumes from there. */
function applyAutomaticDeloads(session, recoveryAvg, plateaus){
  if(recoveryAvg==null || recoveryAvg>=RECOVERY_FLOOR) return [];
  const applied=[];
  plateaus.forEach(({e,plateau})=>{
    if(plateau.weight<=0) return; // bodyweight-only lift — nothing to deload
    const newKg=r1(plateau.weight*0.88);
    STATE.deloadOverrides=STATE.deloadOverrides||{};
    STATE.deloadOverrides[e.id]={ kg:newKg, date:today };
    e.kg=newKg;
    applied.push({ name:e.name, from:plateau.weight, to:newKg });
  });
  return applied;
}
async function fetchInsight(session){
  try{
    const ctx=await buildInsightContext(session);
    const applied=applyAutomaticDeloads(session, ctx.recoveryAvg, ctx.plateaus);
    const lines=ctx.lines.slice();
    applied.forEach(a=> lines.push('AUTO-DELOAD APPLIED: '+a.name+' automatically dropped from '+a.from+' to '+a.to+' '+STATE.unit+' due to the plateau + low recovery — report this as a fact that already happened, not a suggestion.'));
    const digest=lines.join('\n');
    const note=await window.Vitality.getInsight({ goal:fullGoalContext(), digest });
    session.insight={ date:today, text:(typeof note==='string'&&note.trim())?note.trim():null };
  }catch(err){ session.insight={ date:today, text:null }; }
  render(); // covers saveState + insight display + any auto-deload reflected in the UI
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPillGroup(e, rx, idx){

/* ---- progression suggestion: no banner, no extra copy — the prefilled
   weight IS the suggestion, lightly tinted when it's a bump. Held steady
   after any miss or a partial session; bumped a small, weight-scaled step
   (in pounds) after a session where every set hit its rep target. */
function suggestedKg(e, rx){
  // an automatic deload overrides the normal suggestion exactly once —
  // until a new real session lands after the override, then it clears
  // itself and normal progression resumes from that fresh data point.
  const ov=STATE.deloadOverrides && STATE.deloadOverrides[e.id];
  if(ov && !histFor(e).some(s=>!s.off && s.date>ov.date)) return ov.kg;
  const real=histFor(e).filter(s=>!s.off);
  if(!real.length) return e.lastKg!=null ? e.lastKg : rx.kg;
  const last=real[real.length-1];
  const sets=last.sets||[];
  if(!sets.length || last.kg<=0) return last.kg;
  const anyFail=sets.some(s=>s.fail);
  const allHit=sets.every(s=>!s.fail && (s.r||0)>=rx.reps);
  if(anyFail || !allHit) return last.kg;
  const bump = last.kg>=135?5:(last.kg>=45?2.5:1);
  return r1(last.kg+bump);
}
function renderPill(e, rx, idx){
  const kind=classifySet(e, idx); const s=e.log[idx]; const logged=kind!=='empty';
  const suggestion = logged ? null : suggestedKg(e, rx);
  const prefillKg = s?s.kg:(suggestion!=null?suggestion:rx.kg);
  const bumped = !logged && e.lastKg!=null && suggestion!=null && suggestion>e.lastKg;
  const prefillR = s?s.reps:rx.reps;
  const pr = isPR(e, idx);
  const row=document.createElement('div'); row.className='pill '+(kind==='failed'?'failed':(kind==='done'?'done':''))+(logged?'':' tappable');
  let status='done';
  if(kind==='done'){ const dr=s.reps-rx.reps; if(dr>0) status='done <span class="sub">· +'+dr+'</span>'; else if(dr<0) status='done <span class="sub">· '+s.reps+' reps</span>'; else status='done'; }
  else if(kind==='failed') status='missed';
  row.innerHTML =
    '<span class="pillIdx">'+(ROMAN[idx]||idx+1)+'</span>'
    + '<span class="pillValue">'
    +   '<input class="pillInput w'+(bumped?' bump':'')+'" type="number" inputmode="decimal" value="'+prefillKg+'" aria-label="Weight" />'
    +   '<span class="pillUnit">'+STATE.unit+(e.perHand?'<span class="pillPerHand">/ea</span>':'')+'</span>'
    +   '<span class="pillTimes">×</span>'
    +   '<input class="pillInput r" type="number" inputmode="numeric" value="'+prefillR+'" aria-label="Reps" />'
    + '</span>'
    + '<span class="pillSpacer"></span>'
    + '<div class="pillActions">'
    + (logged
        ? '<span class="pillStatus">'+(pr?'<span class="pillPr">★ </span>':'')+status+'</span>'
          + (kind==='done'?'<button class="pillDrop" aria-label="Add drop set">+ Drop</button>':'')
          + '<button class="pillReset" aria-label="Undo set">'+IC_reset()+'</button>'
        : '<button class="pillHit" aria-label="Log set">Hit it →</button><button class="pillMiss" aria-label="Mark missed">Miss</button>')
    + '</div>';
  const wIn=row.querySelector('.w'), rIn=row.querySelector('.r');
  const commit=()=>{ const kg=parseFloat(wIn.value); const reps=Math.round(parseFloat(rIn.value)); if(!Number.isFinite(kg)||kg<0||!Number.isFinite(reps)||reps<0) return; if(reps===0){ doLog(e, idx, kg, 0, true); } else { doLog(e, idx, kg, reps, false); } };
  const stop=ev=>ev.stopPropagation();
  [wIn,rIn].forEach(inp=>{ inp.addEventListener('click',stop); inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); inp.blur(); } }); });
  if(!logged) row.addEventListener('click', commit);
  const hit=row.querySelector('.pillHit'); if(hit) hit.addEventListener('click',ev=>{ stop(ev); commit(); });
  const miss=row.querySelector('.pillMiss'); if(miss) miss.addEventListener('click',ev=>{ stop(ev); const kg=parseFloat(wIn.value)|| (e.lastKg!=null?e.lastKg:rx.kg); doLog(e, idx, kg, 0, true); });
  const reset=row.querySelector('.pillReset'); if(reset) reset.addEventListener('click',ev=>{ stop(ev); e.log[idx]=null; stopRest(e.id); render(); });
  const dropBtn=row.querySelector('.pillDrop'); if(dropBtn) dropBtn.addEventListener('click',ev=>{ stop(ev); addDrop(e, idx); });
  return row;
}
function addDrop(e, idx){
  const s=e.log[idx]; if(!s) return; s.drops=s.drops||[];
  const lastKg = s.drops.length? s.drops[s.drops.length-1].kg : s.kg;
  s.drops.push({ kg:r1(lastKg*0.8), reps:s.reps }); saveState(); render();
}
function renderDropRow(e, idx, di){
  const s=e.log[idx]; const dr=s.drops[di];
  const row=document.createElement('div'); row.className='dropRow';
  row.innerHTML = '<span class="dropArrow">↳</span><input class="pillInput w small" type="number" inputmode="decimal" value="'+dr.kg+'" aria-label="Drop weight"/><span class="pillUnit">'+STATE.unit+'</span><span class="pillTimes">×</span><input class="pillInput r small" type="number" inputmode="numeric" value="'+dr.reps+'" aria-label="Drop reps"/><button class="dropX" aria-label="Remove drop">×</button>';
  const wIn=row.querySelector('.w'), rIn=row.querySelector('.r');
  const commit=()=>{ const kg=parseFloat(wIn.value); const reps=Math.round(parseFloat(rIn.value)); if(Number.isFinite(kg)&&kg>=0) dr.kg=kg; if(Number.isFinite(reps)&&reps>=0) dr.reps=reps; saveState(); };
  wIn.addEventListener('change',commit); rIn.addEventListener('change',commit);

}

function doLog(e, idx, kg, reps, fail){
  const _sess=curSession(); if(!_sess.startedAt) _sess.startedAt=Date.now();
  const wasComplete = exComplete(e);
  const pbBefore = bestKgExclToday(e);
  e.log[idx] = fail ? {kg, reps:0, fail:true} : {kg, reps};
  rollupToday(e);
  render();
  // re-find the live card + pill for the shimmer / celebration
  const card=document.querySelector('.ex[data-id="'+e.id+'"]');
  if(!fail && card){ const pills=card.querySelectorAll('.pill'); const rowEl=pills[idx]; if(rowEl){ rowEl.classList.add('shimmer'); setTimeout(()=>rowEl.classList.remove('shimmer'),820); } }
  // progressive-overload celebration: a logged set that beats your prior best, completing the lift
  if(!fail && pbBefore>0 && (kg>pbBefore || (kg===pbBefore))){
    const beats = kg>pbBefore || (kg===pbBefore && reps>bestRepsAt(e,pbBefore));
    if(beats && !wasComplete && exComplete(e) && card){ card.classList.add('celebrate'); setTimeout(()=>card.classList.remove('celebrate'),1650); celebrate(e, kg, reps); }
  }
  if(!fail && (!e.group || isLastInGroup(e, curSession()))) startRest(e);
}
/* ---- supersets / circuits: exercises sharing e.group rest together - */
function isLastInGroup(e, session){
  if(!e.group) return true;
  const mem=session.ex.filter(x=>x.group===e.group);
  return mem.length ? mem[mem.length-1].id===e.id : true;
}
function nextGroupLetter(session){
  const used=new Set(session.ex.map(x=>x.group).filter(Boolean));
  for(const l of 'ABCDEFGH') if(!used.has(l)) return l;
  return 'X';
}
function linkWithNext(e, session){
  const idx=session.ex.findIndex(x=>x.id===e.id); const next=session.ex[idx+1]; if(!next) return;
  const gid=e.group||next.group||nextGroupLetter(session);
  e.group=gid; next.group=gid; render();
}
function ungroup(e){ delete e.group; render(); }
function rollupToday(e){
  const done = e.log.filter(s=>s&&!s.fail);
  let h = histFor(e).filter(x=>x.date!==today);
  if(done.length){ const top=done.reduce((a,b)=>b.kg>a.kg?b:a); const sets=e.log.filter(s=>s).map(s=>s.fail?{r:s.reps,fail:true}:{r:s.reps}); h.push({date:today, kg:top.kg, sets}); h.sort((a,b)=>a.date.localeCompare(b.date)); e.lastKg=top.kg; }
  STATE.history[e.id]=h;
  STATE.exerciseNames=STATE.exerciseNames||{}; STATE.exerciseNames[e.id]=e.name;
}

/* ---- header actions router --------------------------------------- */
function handleAct(act, e, session, btn){
  if(act==='eye'){ e.collapsed=!e.collapsed; render(); }
  else if(act==='pin'){ e.pinned=!e.pinned; render(); }
  else if(act==='form'){ openForm(e); }

}

   ================================================================= */
const restTimers={};
const REST_RING_C = Math.round(2*Math.PI*15*1000)/1000;
function startRest(e){ stopRest(e.id); const rx=prescription(e); restTimers[e.id]={remaining:rx.rest, total:Math.max(1,rx.rest), handle:null}; tickRest(e); const card=document.querySelector('.ex[data-id="'+e.id+'"]'); if(card) mountRestBar(card, e); }
function tickRest(e){ const t=restTimers[e.id]; if(!t) return; t.handle=setInterval(()=>{ t.remaining-=1; updateRest(e.id); },1000); }
function stopRest(id){ const t=restTimers[id]; if(t&&t.handle) clearInterval(t.handle); delete restTimers[id]; }
function paintRest(bar, t){
  const over=t.remaining<=0;
  bar.classList.toggle('over',over);
  bar.querySelector('.restTime').textContent = over?'go →':mmss(Math.max(0,t.remaining));
  const ring=bar.querySelector('.restRingFill');
  if(ring){ const pct=Math.max(0,Math.min(1, t.remaining/(t.total||1))); ring.style.strokeDashoffset=String(REST_RING_C*(1-pct)); }
}
function mountRestBar(card, e){ const slot=card.querySelector('.restSlot'); const t=restTimers[e.id]; if(!t||!slot){ if(slot)slot.innerHTML=''; return; }
  const over=t.remaining<=0;
  slot.innerHTML='<div class="restbar'+(over?' over':'')+'"><button class="restStep" data-d="-15">−15</button><div class="restMid"><svg class="restRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="restRingTrack" cx="18" cy="18" r="15"/><circle class="restRingFill" cx="18" cy="18" r="15" style="stroke-dasharray:'+REST_RING_C+'"/></svg><div class="restTime">'+(over?'go →':mmss(Math.max(0,t.remaining)))+'</div><div class="restLabel">'+(e.group?('Superset '+e.group):e.name)+'</div></div><button class="restStep" data-d="15">+15</button><button class="restX" aria-label="Dismiss">×</button></div>';
  paintRest(slot.querySelector('.restbar'), t);
  slot.querySelector('[data-d="-15"]').onclick=()=>{ t.remaining-=15; updateRest(e.id); };
  slot.querySelector('[data-d="15"]').onclick=()=>{ t.remaining+=15; updateRest(e.id); };
  slot.querySelector('.restX').onclick=()=>{ stopRest(e.id); slot.innerHTML=''; };
}
function updateRest(id){ const card=document.querySelector('.ex[data-id="'+id+'"]'); const t=restTimers[id]; if(!card||!t) return; const bar=card.querySelector('.restbar'); if(!bar) return; paintRest(bar, t); }

/* ====================================================================
   DRAG TO REORDER
   ================================================================= */
function wireDrag(card, e, session){
  const grip=card.querySelector('.grip'); if(!grip) return;
  grip.addEventListener('pointerdown', ev=>{
    if(e.pinned){ return; } // pinned lifts hold the top
    ev.preventDefault(); grip.classList.add('dragging'); card.classList.add('drag-ghost');
    const wrap=$('#exwrap'); const cards=[...wrap.querySelectorAll('.ex')];
    const move=mev=>{ const y=mev.clientY; let target=null; cards.forEach(c=>{ if(c===card) return; const r=c.getBoundingClientRect(); if(y>r.top && y<r.bottom) target=c; }); if(target){ const r=target.getBoundingClientRect(); const after = y > r.top + r.height/2; wrap.insertBefore(card, after?target.nextSibling:target); } };
    const up=()=>{ grip.classList.remove('dragging'); card.classList.remove('drag-ghost'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
      // commit new order to the session array (respecting pins at top)
      const ids=[...wrap.querySelectorAll('.ex')].map(c=>c.dataset.id);
      session.ex.sort((a,b)=> ids.indexOf(a.id)-ids.indexOf(b.id));
      render(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}

function topReps(s){ const d=(s.sets||[]).filter(x=>!x.fail).map(x=>x.r); return d.length?Math.max(...d):0; }
function setCount(s){ return (s.sets||[]).length; }
function drawChart(e, list, active){
  const plot=$('#hplot'), cap=$('#hcap');
  if(!list.length){ plot.innerHTML='<svg viewBox="0 0 600 240" preserveAspectRatio="none"><text class="xlab" x="300" y="120" text-anchor="middle">log your first session to start the chart</text></svg>'; cap.textContent=''; return; }
  const VB_W=600,VB_H=240,PADL=46,PADR=20,PADT=22,PADB=36;
  const real=list.filter(s=>!s.off), off=list.filter(s=>s.off);
  const ws=list.map(s=>s.kg);
  let lo=Math.max(0,Math.floor(Math.min(...ws)/5)*5-5), hi=Math.ceil(Math.max(...ws)/5)*5+5;
  if(hi-lo<10) hi=lo+10; if((hi-lo)%10!==0) hi+=5;
  const oldestAgo=Math.max(...list.map(s=>daysAgo(s.date)));
  const domain= active==='ALL'? Math.max(oldestAgo,1):Math.max(RANGES[active],1);
  const X=k=>{ const f=Math.min(1,Math.max(0,1-daysAgo(k)/domain)); return PADL+f*(VB_W-PADL-PADR); };
  const Y=kg=>(VB_H-PADB)-(kg-lo)/(hi-lo)*(VB_H-PADB-PADT);
  const step=(hi-lo)<=30?5:10;
  const best = real.length? real.reduce((b,s)=>(s.kg>b.kg||(s.kg===b.kg&&topReps(s)>topReps(b)))?s:b) : null;
  let svgs='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mint);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--mint);stop-opacity:0"/></linearGradient></defs>';
  for(let kg=lo;kg<=hi;kg+=step){ svgs+='<line class="grid" x1="'+PADL+'" y1="'+Y(kg)+'" x2="'+(VB_W-PADR)+'" y2="'+Y(kg)+'"/><text class="axis-label" x="'+(PADL-10)+'" y="'+(Y(kg)+4)+'" text-anchor="end">'+kg+'</text>'; }
  if(real.length){ const pts=real.map(s=>X(s.date)+','+Y(s.kg)); const last=real[real.length-1], first=real[0];
    if(real.length>1){ svgs+='<path class="area" d="M'+X(first.date)+','+(VB_H-PADB)+' L'+pts.join(' L')+' L'+X(last.date)+','+(VB_H-PADB)+' Z"/><polyline class="line" points="'+pts.join(' ')+'"/>'; } }
  let dotI=0;
  off.forEach(s=>{ svgs+='<circle class="dot off" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  real.forEach(s=>{ svgs+='<circle class="dot'+(best&&s.date===best.date?' best':'')+'" style="--i:'+(dotI++)+'" cx="'+X(s.date)+'" cy="'+Y(s.kg)+'" r="5"/>'; });
  svgs+='<text class="xlab" x="'+PADL+'" y="'+(VB_H-6)+'" text-anchor="start">'+fmtDate(list[0].date)+'</text><text class="xlab" x="'+(VB_W-PADR)+'" y="'+(VB_H-6)+'" text-anchor="end">today</text></svg>';
  plot.innerHTML=svgs;
  if(real.length>=2){ const d=r1(real[real.length-1].kg-real[0].kg); cap.innerHTML=(d>=0?'+':'')+d+' '+STATE.unit+' <span class="mu">· '+(active==='ALL'?'all time':'in '+active)+'</span>'; }
  else cap.textContent= real.length?'one session here':'';
}
function drawStats(e){
  const real=histFor(e).filter(s=>!s.off);

  const w30=real.filter(s=>daysAgo(s.date)<=30); const d30=w30.length>=2?r1(w30[w30.length-1].kg-w30[0].kg):0;
  const hstats=$('#hstats');

function drawTable(e, all){

  body.innerHTML=all.slice().reverse().slice(0,10).map(s=>{
