<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fuel</title>
<!--
  FUEL — water (Episode 1: one number, one button, the week draws itself) plus
  a supplement stack (Episode 2: search 100+ real supplements, log what you
  took, schedule what time of day). Two tabs, one tile, same sealed rules: no
  network, saves through window.Vitality.
  Store: { water: {'YYYY-MM-DD': count}, stack: { items:[{u,id|custom,name,dose,window}],
  takenByDay:{'YYYY-MM-DD':[u,...]}, offBlocks:[...] } }
-->
<style>
  :root{
    --bg:#050506;--fg:#ededf0;--brand:#6EE7B7;--brand-soft:rgba(110,231,183,.08);
    --muted:#84848c;--muted-strong:#a8a8b0;--border:#1d1d22;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:Georgia,'Times New Roman',serif;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
    radial-gradient(58% 44% at 50% -6%, rgba(110,231,183,.13), transparent 62%),
    radial-gradient(1.5px 1.5px at 14% 16%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1px 1px at 76% 10%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1.5px 1.5px at 52% 6%, rgba(255,255,255,.32), transparent 100%),
    radial-gradient(1px 1px at 30% 28%, rgba(255,255,255,.28), transparent 100%)}
  body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:-1;pointer-events:none;background:
    linear-gradient(to top, rgba(8,19,14,.85), transparent 80%),
    linear-gradient(115deg, transparent 42%, rgba(13,26,23,.75) 43%, rgba(13,26,23,.75) 58%, transparent 59%),
    linear-gradient(245deg, transparent 38%, rgba(10,18,16,.9) 39%, rgba(10,18,16,.9) 62%, transparent 63%);
    -webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
  .shell{width:100%;max-width:560px;text-align:center}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em;text-align:left}
  .sub{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0;text-align:left}

  .well{margin-top:30px}
  .kick{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);text-align:center}
  .count{font-family:var(--serif);font-style:italic;font-size:clamp(72px,18vw,110px);line-height:1;color:#fff;margin-top:10px;
    text-shadow:0 0 44px rgba(110,231,183,.25);text-align:center}
  .of{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px;text-align:center}
  .btnRow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:30px}
  .minus{width:46px;height:46px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;transition:all .15s}
  .minus:hover{color:#fff;border-color:var(--muted)}
  .glass{padding:16px 40px;border-radius:999px;border:none;background:linear-gradient(180deg,#8df0c9,var(--brand));color:#04140d;
    font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 34px -12px var(--brand);transition:transform .15s var(--ease)}
  .glass:hover{transform:translateY(-1px)}
  .glass:active{transform:scale(.97)}

  .week{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:52px;height:64px}
  .day{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bar{width:16px;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg,var(--brand),rgba(110,231,183,.25));min-height:3px;transition:height .5s var(--ease)}
  .bar.zero{background:var(--border)}
  .dLab{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .dLab.today{color:var(--brand)}
  .foot{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:34px;text-align:center}
  .starterTag{width:max-content;max-width:92%;margin:0 auto 20px;padding:6px 14px;border:1px solid rgba(110,231,183,.25);border-radius:999px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#84848c;text-align:center}
  .starterTag,.starterTag *{line-height:1.6}

  /* ── tab bar, matched to Finance's for a consistent house pattern ── */
  .tabBar{display:flex;gap:6px;margin-top:34px;padding-top:18px;border-top:1px solid var(--border)}
  .tab{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .tab:hover{color:#fff;border-color:var(--muted)}
  .tab.on{color:#04140d;background:var(--brand);border-color:var(--brand)}

  /* ── the stack: a time-blocked supplement checklist ── */
  .stackHead{text-align:left}
  .tally{border:1px solid var(--border);background:rgba(14,14,17,.5);border-radius:14px;padding:16px 18px}
  .tally .top{display:flex;justify-content:space-between;align-items:baseline}
  .tally .n{font-family:var(--serif);font-style:italic;font-size:28px}
  .tally .n b{font-style:normal;color:var(--brand)}
  .tally .lb{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .meter{margin-top:12px;height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
  .meter .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#3ddc97,var(--brand));transition:width .6s var(--ease)}

  .stackSearch{position:relative;margin:18px 0 4px;z-index:10}
  .sBox{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:12px;padding:12px 14px;transition:border-color .2s}
  .sBox:focus-within{border-color:var(--brand)}
  .sBox svg{width:14px;height:14px;color:var(--muted);flex:none}
  .sBox input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:14px;color:var(--fg)}
  .sBox input::placeholder{color:rgba(255,255,255,.3)}
  .sDrops{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;background:#0b0b0e;border:1px solid var(--border);border-radius:12px;overflow:hidden auto;max-height:280px;box-shadow:0 20px 48px -10px rgba(0,0,0,.8);display:none;text-align:left}
  .sDrops.on{display:block}
  .sRow{display:block;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--border);background:none;border-left:none;border-right:none;border-top:none;color:var(--fg);cursor:pointer;font:inherit}
  .sRow:last-child{border-bottom:none}
  .sRow:hover{background:rgba(110,231,183,.06)}
  .sRow .nm{font-size:13.5px}
  .sRow .nt{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sRow .ds{font-family:var(--mono);font-size:10px;color:var(--brand);float:right}
  .sRow.custom .nm i{font-style:italic;color:var(--brand)}

  .pairChip{display:none;margin:10px 2px 0;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-strong);text-align:left}
  .pairChip.on{display:flex}
  .pairChip .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
  .pairChip button{background:none;border:none;font-style:italic;color:var(--brand);border-bottom:1px solid rgba(110,231,183,.4);cursor:pointer;font:inherit;padding:0}

  .blk{text-align:left;display:flex;gap:14px;padding:15px 2px;border-top:1px solid var(--border)}
  .blk:first-child{border-top:none}
  .blk .side{flex:0 0 82px}
  .blk .side .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-strong)}
  .blk .side .w{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:3px}
  .blk .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .blk .empty{font-family:var(--serif);font-style:italic;color:rgba(255,255,255,.32);font-size:13px}

  .sRowItem{display:flex;align-items:center;gap:11px;border:1px solid var(--border);background:rgba(14,14,17,.5);border-radius:13px;padding:11px 12px;transition:border-color .25s,opacity .25s}
  .sRowItem:hover{border-color:rgba(110,231,183,.28)}
  .sChk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;color:transparent;cursor:pointer;background:none;transition:all .2s}
  .sChk svg{width:12px;height:12px}
  .sBd{flex:1;min-width:0;text-align:left}
  .sNm{font-size:14px;font-weight:500}
  .sMeta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
  .sDose{font-family:var(--mono);font-size:10.5px;color:var(--muted-strong)}
  .sTag{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;border:1px solid;border-radius:999px;padding:2px 7px}
  .sTag.gold{color:#f1cf7a;border-color:rgba(241,207,122,.35)}
  .sTag.violet{color:#c4b5fd;border-color:rgba(196,181,253,.35)}
  .sTag.sky{color:#9ad7f5;border-color:rgba(154,215,245,.32)}
  .sInfo{flex:none;color:rgba(255,255,255,.3);padding:5px;background:none;border:none;cursor:pointer;transition:color .2s}
  .sInfo:hover{color:var(--brand)}
  .sInfo svg{width:14px;height:14px;display:block}
  .sX{flex:none;color:rgba(255,255,255,.2);padding:5px 3px;font-size:15px;line-height:1;background:none;border:none;cursor:pointer;transition:color .2s}
  .sX:hover{color:#ff8b8b}
  .sRowItem.done{opacity:.5}
  .sRowItem.done .sChk{background:var(--brand);border-color:var(--brand);color:#04140d}
  .sRowItem.done .sNm{text-decoration:line-through;text-decoration-color:rgba(110,231,183,.5);color:var(--muted-strong)}
  @keyframes sPop{0%{transform:scale(.6)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
  .sChk.pop{animation:sPop .4s var(--ease)}

  .stackFirst{margin-top:22px;text-align:center}
  .stackFirst p{font-family:var(--serif);font-style:italic;color:var(--muted-strong);font-size:15.5px}
  .stackBtn{display:block;width:100%;margin-top:20px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font:inherit;font-size:12.5px;padding:11px 14px;cursor:pointer;transition:color .14s,border-color .14s}
  .stackBtn:hover{color:var(--brand);border-color:var(--brand)}

  /* when-to-take sheet */
  .fuelVeil{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
  .fuelVeil.on{opacity:1;pointer-events:auto}
  .fuelSheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#0b0b0e;border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;max-width:600px;margin:0 auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .4s var(--ease);max-height:82vh;overflow-y:auto;text-align:left}
  .fuelSheet.on{transform:none}
  .fuelSheet .grab{width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,.14);margin:0 auto 16px}
  .fuelSheet h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;margin-bottom:4px}
  .fuelSheet .sub2{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .fuelSheet .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin:16px 0 9px}
  .tblocks{display:flex;gap:8px;flex-wrap:wrap}
  .tb{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid rgba(110,231,183,.4);color:var(--brand);border-radius:999px;padding:9px 15px;cursor:pointer;transition:all .2s;background:none}
  .tb.off{border-color:var(--border);color:rgba(255,255,255,.3)}
  .tbHint{font-size:12px;color:var(--muted);margin-top:8px}
  .editItem{border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:13px;padding:12px 13px;margin-bottom:9px}
  .eiHead{font-size:14px;font-weight:500}
  .eiRow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .eiLbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
  .slotPick{font-family:var(--mono);font-size:10px;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6px 10px;background:none;cursor:pointer;transition:all .2s}
  .slotPick.on{background:var(--brand);border-color:var(--brand);color:#04140d}
  .eiDoseIn{font-family:var(--mono);font-size:11.5px;color:var(--brand);background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:6px 10px;outline:none;width:120px}
  .fuelDone{display:block;width:100%;margin-top:16px;background:var(--brand);color:#04140d;font-weight:700;font-size:15px;border-radius:12px;padding:13px;cursor:pointer;border:none}

  /* cozy reader */
  .reader{margin-top:14px;display:none;border:1px solid rgba(110,231,183,.3);background:rgba(255,255,255,.02);border-radius:14px;padding:14px}
  .reader.on{display:block}
  .reader .rt{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--brand)}
  .rbar{margin-top:10px;height:4px;border-radius:999px;background:var(--border);overflow:hidden}
  .rbar span{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,transparent,var(--brand),transparent);animation:rSlide 1.4s var(--ease) infinite}
  @keyframes rSlide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
  .rdots{display:flex;gap:6px;margin-top:10px}
  .rdots i{width:6px;height:6px;border-radius:50%;background:var(--brand);opacity:.4;animation:rDot 1.2s ease-in-out infinite}
  .rdots i:nth-child(2){animation-delay:.2s}
  .rdots i:nth-child(3){animation-delay:.4s}
  @keyframes rDot{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  @media (prefers-reduced-motion: reduce){ .fuelVeil,.fuelSheet,.rbar span,.rdots i{transition-duration:.01ms!important;animation:none!important} }
</style>
</head>
<body>
<div class="shell">
<div class="starterTag">✦ starter — the value is what you build · the videos show how</div>
  <h1>Fuel</h1>
  <div class="well" id="app"></div>
</div>

<div class="fuelVeil" id="fuelVeil"></div>
<div class="fuelSheet" id="fuelSheet">
  <div class="grab"></div>
  <div id="fuelSheetBody"></div>
</div>

<script>
const GOAL=8;
let store={};
let view='water';
function key(d){const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function persist(){window.Vitality.save(store)}
function today(){if(!store.water||typeof store.water!=='object')store.water={};return store.water}

function tabBar(){
  return '<div class="tabBar">'+[['water','Water'],['stack','Stack']]
    .map(t=>'<button class="tab'+(view===t[0]?' on':'')+'" data-view="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
}

function renderWater(){
  const w=today(),n=w[key()]||0;
  let bars='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const c=w[key(d)]||0,h=Math.max(3,Math.min(64,(c/GOAL)*64));
    const lab=i===0?'today':['SU','MO','TU','WE','TH','FR','SA'][d.getDay()];
    bars+='<div class="day"><div class="bar'+(c?'':' zero')+'" style="height:'+h+'px" title="'+c+'"></div><span class="dLab'+(i===0?' today':'')+'">'+lab+'</span></div>';
  }
  return '<div class="kick">✦ water</div>'
    +'<div class="count">'+n+'</div>'
    +'<div class="of">of '+GOAL+' today</div>'
    +'<div class="btnRow"><button class="minus" data-d="-1" aria-label="Remove one">−</button><button class="glass" data-d="1">+ Log a glass</button></div>'
    +'<div class="week">'+bars+'</div>'
    +'<p class="foot">feeds your peak score · the mentor notices the pattern</p>';
}

/* ============================================================
   THE STACK — search-and-log 100+ real supplements, time-blocked.
   Lives inside the same store as water, under its own key.
   ============================================================ */
function stackState(){
  if(!store.stack||typeof store.stack!=='object') store.stack={items:[],takenByDay:{},offBlocks:[]};
  if(!Array.isArray(store.stack.items)) store.stack.items=[];
  if(!store.stack.takenByDay||typeof store.stack.takenByDay!=='object') store.stack.takenByDay={};
  if(!Array.isArray(store.stack.offBlocks)) store.stack.offBlocks=[];
  return store.stack;
}
function stackItems(){ return stackState().items; }
function takenToday(){ const S=stackState(),k=key(); if(!Array.isArray(S.takenByDay[k])) S.takenByDay[k]=[]; return S.takenByDay[k]; }
function escStk(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4.5 12.5l5 5 10-11"/></svg>';
const ICON_INFO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.2v.3"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>';

const stkWindows=[{"key":"morning","title":"Morning","time":"7-10 AM"},{"key":"lunch","title":"Midday","time":"12-2 PM"},{"key":"evening","title":"Evening","time":"6-9 PM"},{"key":"bed","title":"Before bed","time":"10 PM"},{"key":"anytime","title":"Anytime","time":"No fixed window"}];
const stkPairs={ 'caffeine':'l-theanine', 'l-theanine':'caffeine', 'vit-d3':'vit-k2', 'vit-k2':'vit-d3', 'omega-3':'vit-d3', 'mag-glycinate':'vit-d3' };
/* the real supplement reference set — dose, timing, and what it does, for
   every entry. This is genuine reference data, not generated per-lookup. */
const stkDB=[{"id":"creatine","name":"Creatine monohydrate","dose":"5 g","window":"anytime","note":"Daily. Consistency matters more than timing.","helps":"Increases strength, power, and short-term work capacity. Mild cognitive benefit.","bestTime":"Any time of day, every day. Skip the loading phase — it isn't necessary.","aliases":["creatine"]},{"id":"beta-alanine","name":"Beta-alanine","dose":"2-5 g","window":"morning","note":"Split doses if the tingles bother you.","helps":"Buffers muscle acidity. Improves endurance on sets in the 1-4 min range.","bestTime":"Daily. Effect is from saturation, not timing of the dose itself.","aliases":["beta alanine"]},{"id":"l-citrulline","name":"L-citrulline","dose":"6-8 g","window":"morning","note":"Empty stomach for absorption.","helps":"Boosts nitric oxide — better pumps and endurance.","bestTime":"30-45 min before training.","aliases":["citrulline","citrulline malate"]},{"id":"whey","name":"Whey protein","dose":"25-40 g","window":"anytime","note":"Use to hit daily protein target.","helps":"Fast-digesting protein for muscle repair + daily protein hitting.","bestTime":"Post-workout or any meal where you're short on protein.","aliases":["whey","protein powder"]},{"id":"casein","name":"Casein protein","dose":"25-40 g","window":"evening","note":"Slow-release. Good before bed.","helps":"Slow-digesting protein. Sustained amino release overnight.","bestTime":"30-60 min before bed.","aliases":["casein"]},{"id":"l-carnitine","name":"L-carnitine","dose":"1-2 g","window":"morning","note":"Take with carbs for uptake.","helps":"Helps shuttle fat into mitochondria. Modest endurance + recovery effect.","bestTime":"With a carb-containing meal, ideally pre-workout.","aliases":["carnitine"]},{"id":"alcar","name":"Acetyl-L-carnitine","dose":"500 mg - 2 g","window":"morning","note":"Crosses blood-brain barrier. Cognitive variant.","helps":"Cognitive + mood support; may sharpen focus.","bestTime":"AM, on an empty stomach if you can tolerate it.","a function stkTagsFor(s){
  const t=[]; const txt=((s.note||'')+' '+(s.bestTime||'')).toLowerCase();
  if(stkPairs[s.id]==='caffeine'||s.id==='l-theanine') t.push(['violet','Pairs with caffeine']);
  if(txt.indexOf('consisten')>-1) t.push(['gold','Be consistent']);
  if(s.window==='bed') t.push(['violet','Before bed']);
  if(txt.indexOf('with food')>-1||txt.indexOf('with a meal')>-1||txt.indexOf('with meals')>-1||txt.indexOf('with dinner')>-1) t.push(['sky','With food']);
  if(txt.indexOf('empty stomach')>-1) t.push(['sky','Empty stomach']);
  return t.slice(0,2);
}
function stkById(id){ for(let i=0;i<stkDB.length;i++) if(stkDB[i].id===id) return stkDB[i]; return null; }
function stkItemName(it){ return it.custom?it.name:(stkById(it.id)||{}).name||it.name; }
function stkEffWindow(w){ return stackState().offBlocks.indexOf(w)>-1?'anytime':w; }
let stkUidN=0; function newStkUid(){ return 'u'+Date.now().toString(36)+(stkUidN++); }
function stkInStack(id){ return stackItems().some(it=>it.id===id); }

function renderStackView(){
  const items=stackItems(), tk=takenToday();
  const total=items.length; let done=0;
  let railHtml='';
  stkWindows.forEach(w=>{
    if(stackState().offBlocks.indexOf(w.key)>-1 && w.key!=='anytime') return;
    const wItems=items.filter(it=>stkEffWindow(it.window)===w.key);
    let list='<div class="items">';
    if(!wItems.length) list+='<div class="empty">Nothing yet</div>';
    wItems.forEach(it=>{
      const s=it.custom?it:(stkById(it.id)||it);
      const isDone=tk.indexOf(it.u)>-1; if(isDone)done++;
      const tags=it.custom?[]:stkTagsFor(s);
      list+='<div class="sRowItem'+(isDone?' done':'')+'" data-u="'+it.u+'">'
        +'<button class="sChk" data-take="'+it.u+'" aria-label="take">'+ICON_CHECK+'</button>'
        +'<div class="sBd"><div class="sNm">'+escStk(stkItemName(it))+'</div><div class="sMeta"><span class="sDose">'+escStk(it.dose||s.dose||'')+'</span>'
        +tags.map(t=>'<span class="sTag '+t[0]+'">'+escStk(t[1])+'</span>').join('')
        +'</div></div>'
        +(it.custom?'':'<button class="sInfo" data-info="'+it.u+'" aria-label="what is this">'+ICON_INFO+'</button>')
        +'<button class="sX" data-rm="'+it.u+'" aria-label="remove">&times;</button></div>';
    });
    list+='</div>';
    railHtml+='<div class="blk"><div class="side"><div class="t">'+w.title+'</div><div class="w">'+w.time+'</div></div>'+list+'</div>';
  });
  return '<div class="stackHead">'
    +'<div class="tally"><div class="top"><span class="n"><b>'+done+'</b> of '+total+'</span><span class="lb">taken today</span></div>'
    +'<div class="meter"><div class="fill" style="width:'+(total?Math.round(done/total*100):0)+'%"></div></div></div>'
    +'<div class="stackSearch"><div class="sBox">'+ICON_SEARCH+'<input id="stkQ" placeholder="Search 100+ supplements to add" autocomplete="off"></div><div class="sDrops" id="stkDrops"></div></div>'
    +'<div class="pairChip" id="stkPair"></div>'
    +(total?'':'<div class="stackFirst"><p>Your stack starts here — search above to add your first one.</p></div>')
    +railHtml
    +'<button class="stackBtn" data-timing>When to take them</button>'
    +'</div>';
}

function stkSearchDb(raw){
  const v=raw.trim().toLowerCase(); if(!v) return [];
  const starts=[], contains=[];
  stkDB.forEach(s=>{
    const n=s.name.toLowerCase();
    const alias=(s.aliases||[]).map(a=>a.toLowerCase());
    if(n.indexOf(v)===0 || alias.some(a=>a.indexOf(v)===0)) starts.push(s);
    else if(n.indexOf(v)>-1 || alias.some(a=>a.indexOf(v)>-1)) contains.push(s);
  });
  starts.sort((a,b)=>a.name.localeCompare(b.name));
  return starts.concat(contains).slice(0,8);
}
function stkPaintDrops(q){
  const drops=document.getElementById('stkDrops'); if(!drops) return;
  const v=(q||'').trim();
  if(!v){ drops.classList.remove('on'); drops.innerHTML=''; return; }
  const hits=stkSearchDb(v);
  let html=hits.map(s=>'<button class="sRow" data-add="'+s.id+'"><span class="ds">'+escStk(s.dose)+'</span><span class="nm">'+escStk(s.name)+'</span><div class="nt">'+escStk(s.helps||s.note||'')+'</div></button>').join('');
  html+='<button class="sRow custom" data-addcustom="'+escStk(v)+'"><span class="nm">Add <i>"'+escStk(v)+'"</i></span><div class="nt">custom supplement · anytime</div></button>';
  drops.innerHTML=html; drops.classList.add('on');
}
function stkSuggestFor(id){
  const mate=stkPairs[id]; const el=document.getElementById('stkPair'); if(!el) return;
  if(!mate||stkInStack(mate)||!stkById(mate)){ el.classList.remove('on'); return; }
  const s=stkById(mate);
  el.innerHTML='<span class="k">Pairs well</span><span>'+escStk(stkById(id).name)+' goes with</span><button data-pairadd="'+mate+'">'+escStk(s.name)+' · add it</button>';
  el.classList.add('on');
  setTimeout(()=>{ el.classList.remove('on'); },9000);
}

    +'<p class="tbHint">Tap a block to turn it off.</p>'
    +'<p class="k">Your stack</p>'
    +'<div class="reader on" id="reader"><p class="rt" id="readerLine">Reading your stack for the best timing</p><div class="rbar"><span></span></div><div class="rdots"><i></i><i></i><i></i></div></div>'
    +'<div id="editList"></div>'
    +'<button class="fuelDone" id="fuelDone">Done</button>'
  );
  paintBlocks();
  runStackReader();
}
function paintBlocks(){
  const wrap=document.getElementById('tblocks'); if(!wrap) return;
  wrap.innerHTML=stkWindows.filter(w=>w.key!=='anytime').map(w=>{
    const off=stackState().offBlocks.indexOf(w.key)>-1;
    return '<button class="tb'+(off?' off':'')+'" data-toggleblock="'+w.key+'">'+escStk(w.title)+'</button>';
  }).join('');
}
const STK_READER_LINES=['Reading your stack for the best timing','Finding what pairs well','Lining up your day'];
function runStackReader(){
  const reader=document.getElementById('reader');
  const editList=document.getElementById('editList');
  reader.classList.add('on'); editList.innerHTML='';
  clearTimeout(window.__stkReaderT); clearInterval(window.__stkReaderI);
  let li=0; document.getElementById('readerLine').textContent=STK_READER_LINES[0];
  window.__stkReaderI=setInterval(()=>{ li=(li+1)%STK_READER_LINES.length; document.getElementById('readerLine').textContent=STK_READER_LINES[li]; },700);
  window.__stkReaderT=setTimeout(()=>{
    clearInterval(window.__stkReaderI);
    reader.classList.remove('on');
    buildEditList();
  }, (window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?50:1500);
}
function buildEditList(){
  const box=document.getElementById('editList'); const items=stackItems();
  if(!items.length){ box.innerHTML='<p style="font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13.5px">Add supplements on the stack first, then schedule them here.</p>'; return; }
  box.innerHTML=items.map((it,idx)=>{
    const s=it.custom?it:(stkById(it.id)||it);
    const pills=stkWindows.map(w=>'<button class="slotPick'+(stkEffWindow(it.window)===w.key?' on':'')+'" data-ei="'+idx+'" data-w="'+w.key+'">'+escStk(w.title)+'</button>').join('');
    return '<div class="editItem"><div class="eiHead">'+escStk(stkItemName(it))+'</div>'
      +'<div class="eiRow"><span class="eiLbl">Dose</span><input class="eiDoseIn" data-eidose="'+idx+'" value="'+escStk(it.dose||s.dose||'')+'" placeholder="e.g. 200 mg"></div>'
      +'<div class="eiRow"><span class="eiLbl">Time</span>'+pills+'</div></div>';
  }).join('');
}

/* ============================================================
   BOOT / RENDER / EVENTS
   ============================================================ */
function render(){
  const html=view==='water'?renderWater():renderStackView();
  document.getElementById('app').innerHTML=html+tabBar();
}

document.addEventListener('click',e=>{
  const tabb=e.target.closest('[data-view]');
  if(tabb){ view=tabb.getAttribute('data-view'); render(); return; }

  const wb=e.target.closest('[data-d]');
  if(wb){
    const w=today(),k=key();
    w[k]=Math.max(0,(w[k]||0)+parseInt(wb.getAttribute('data-d'),10));
    persist(); render(); return;
  }

  const take=e.target.closest('[data-take]');
  if(take){
    const u=take.getAttribute('data-take'), tk=takenToday();
    const i=tk.indexOf(u);
    if(i>-1){ tk.splice(i,1); persist(); render(); }
    else{
      tk.push(u); persist();
      take.classList.add('pop');
      setTimeout(render,340);
    }
    return;
  }
  const rm=e.target.closest('[data-rm]');
  if(rm){
    const u=rm.getAttribute('data-rm');
    stackState().items=stackItems().filter(it=>it.u!==u);
    stackState().takenByDay[key()]=takenToday().filter(x=>x!==u);
    persist(); render(); return;
  }
  const info=e.target.closest('[data-info]');
  if(info){
    const u=info.getAttribute('data-info'), it=stackItems().find(x=>x.u===u);
    if(it&&!it.custom) openSuppInfo(stkById(it.id));
    return;
  }
  const add=e.target.closest('[data-add]');
  if(add){
    const id=add.getAttribute('data-add'), s=stkById(id);
    if(s){ stackItems().push({u:newStkUid(),id:s.id,window:s.window,dose:s.dose||''}); persist();
      document.getElementById('stkQ').value=''; document.getElementById('stkDrops').classList.remove('on');
      render(); stkSuggestFor(id);
    }
    return;
  }
  const addc=e.target.closest('[data-addcustom]');
  if(addc){
    const nm=addc.getAttribute('data-addcustom');
    stackItems().push({u:newStkUid(),custom:true,name:nm,dose:'',window:'anytime'}); persist();
    document.getElementById('stkQ').value=''; document.getElementById('stkDrops').classList.remove('on');
    render(); return;
  }
  const pairadd=e.target.closest('[data-pairadd]');
  if(pairadd){
    const mate=pairadd.getAttribute('data-pairadd'), s=stkById(mate);
    if(s){ stackItems().push({u:newStkUid(),id:mate,window:s.window,dose:s.dose||''}); persist(); }
    document.getElementById('stkPair').classList.remove('on'); render(); return;
  }
  if(e.target.closest('[data-timing]')){ openTimingSheet(); return; }
  if(e.target.closest('#fuelVeil')){ closeFuelSheet(); return; }
  if(e.target.closest('#fuelDone')){ closeFuelSheet(); return; }
  const tblk=e.target.closest('[data-toggleblock]');
  if(tblk){
    const w=tblk.getAttribute('data-toggleblock'), S=stackState(), i=S.offBlocks.indexOf(w);
    if(i>-1) S.offBlocks.splice(i,1); else S.offBlocks.push(w);
    persist(); paintBlocks(); render(); return;
  }
  const slot=e.target.closest('.slotPick');
  if(slot){
    const idx=+slot.getAttribute('data-ei'), it=stackItems()[idx];
    if(it){ it.window=slot.getAttribute('data-w'); persist(); buildEditList(); render(); }
    return;
  }
  if(!e.target.closest('.stackSearch')){ const d=document.getElementById('stkDrops'); if(d) d.classList.remove('on'); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='stkQ'){ stkPaintDrops(e.target.value); return; }
  const dosein=e.target.closest('[data-eidose]');
  if(dosein){ const idx=+dosein.getAttribute('data-eidose'), it=stackItems()[idx]; if(it){ it.dose=dosein.value; persist(); } return; }
});

function openSuppInfo(s){
  if(!s) return;
  const wLabel=s.window?(stkWindows.find(w=>w.key===s.window)||{}).title||s.window:'';
  openFuelSheet(
    '<h3>'+escStk(s.name)+'</h3>'
    +'<p class="sub2">'+escStk(s.dose)+(wLabel?' · usually '+escStk(wLabel).toLowerCase():'')+'</p>'
    +'<p class="k">What it does</p><p style="font-size:14px;line-height:1.6;color:var(--muted-strong)">'+escStk(s.helps||'')+'</p>'
    +'<p class="k">When to take it</p><p style="font-size:14px;line-height:1.6;color:var(--muted-strong)">'+escStk(s.bestTime||s.note||'')+'</p>'
    +'<button class="fuelDone" id="fuelDone">Close</button>'
  );
}

if(!window.Vitality){window.Vitality={save:function(d){try{localStorage.setItem('v:prev:fuel',JSON.stringify(d));}catch(e){}return Promise.resolve(true);},load:function(){try{return Promise.resolve(JSON.parse(localStorage.getItem('v:prev:fuel')||'{}'));}catch(e){return Promise.resolve({});}}};}
(async()=>{const d=await window.Vitality.load();store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};render();})();
</script>
</body>
