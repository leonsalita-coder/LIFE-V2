<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Finance</title>
<!--
  FINANCE — three pages, one bottom tab bar: Net worth (accounts + stocks →
  the trend), Stocks (holdings, live-priced via Finnhub), Subscriptions
  (monthly burn). Each page carries its own base inputs; the mentor builds the
  rest.

  Sealed: no network. Saves through window.Vitality. Stock prices via the host
  bridge: window.Vitality.stock(symbol) (server-routed Finnhub key; manual works
  keyless). Store: { accounts:[{id,name,balance}], holdings:[{id,symbol,shares,price}],
  subs:[{id,name,amount}], history:[{t,value}] }
-->
<style>
  :root{
    --bg:#050506;--fg:#ededf0;--brand:#6EE7B7;
    --muted:#84848c;--muted-strong:#a8a8b0;--border:#1d1d22;
    --neg:#ff8b8b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --serif:Georgia,'Times New Roman',serif;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;position:relative}
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
    radial-gradient(58% 44% at 50% -6%, rgba(110,231,183,.13), transparent 62%),
    radial-gradient(1.5px 1.5px at 14% 16%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1px 1px at 76% 10%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1.5px 1.5px at 52% 6%, rgba(255,255,255,.32), transparent 100%),
    radial-gradient(1px 1px at 30% 28%, rgba(255,255,255,.28), transparent 100%)}
  body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:-1;pointer-events:none;background:
    linear-gradient(to top, rgba(8,19,14,.85), transparent 80%),
    linear-gradient(115deg, transparent 42%, rgba(13,26,23,.75) 43%, rgba(13,26,23,.75) 58%, transparent 59%),
    linear-gradient(245deg, transparent 38%, rgba(10,18,16,.9) 39%, rgba(10,18,16,.9) 62%, transparent 63%);
    -webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
  .shell{width:100%;max-width:560px}
  h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}
  .well{margin-top:34px;text-align:center}
  .kick{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
  .worth{font-family:var(--serif);font-style:italic;font-size:clamp(48px,10.5vw,74px);line-height:1;color:#fff;margin-top:12px;text-shadow:0 0 44px rgba(110,231,183,.22)}
  .worth.neg{color:var(--neg);text-shadow:0 0 44px rgba(255,139,139,.18)}
  .worth .u{font-size:.34em;font-style:normal;color:var(--muted);margin-left:2px}
  .delta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;margin-top:10px;color:var(--muted)}
  .delta b{color:var(--brand);font-weight:600}
  .delta b.down{color:var(--neg)}
  .gwrap{margin-top:28px}
  .gEmpty{padding:22px 0;color:var(--muted);font-size:12.5px;text-align:center}
  .gEmpty b{color:var(--brand);font-weight:600}
  .list{margin-top:26px;text-align:left;max-width:470px;margin-left:auto;margin-right:auto}
  .row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(14,14,17,.5);margin-bottom:8px;animation:up .4s var(--ease) both}
  @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .row .nmwrap{min-width:0}
  .row .nm{font-size:14px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .hsub{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:1px}
  .row .bal{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--muted-strong);padding:3px 7px;border-radius:6px;transition:background .12s,color .12s}
  .row .bal:hover{background:rgba(110,231,183,.09);color:var(--brand)}
  .row .bal.neg{color:var(--neg)}
  .row .del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;opacity:.45;padding:2px 4px;transition:opacity .12s,color .12s}
  .row .del:hover{opacity:1;color:var(--neg)}
  .balIn{width:118px;background:rgba(0,0,0,.45);border:1px solid var(--brand);border-radius:6px;padding:4px 8px;color:var(--fg);font-family:var(--mono);font-size:14px;text-align:right;outline:none}
  .addRow{display:grid;grid-template-columns:1fr 122px auto;gap:8px;margin-top:2px}
  .addRow.stock{grid-template-columns:1fr 100px auto}
  .addRow input{background:rgba(14,14,17,.7);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--fg);font:inherit;outline:none;min-width:0}
  .addRow input:focus{border-color:var(--brand)}
  .addRow button{border:none;background:var(--brand);color:#04140d;font-weight:700;border-radius:10px;padding:0 17px;cursor:pointer}
  .addBtn{margin-top:4px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font:inherit;font-size:12.5px;padding:10px 14px;cursor:pointer;width:100%;transition:color .14s,border-color .14s}
  .addBtn:hover{color:var(--brand);border-color:var(--brand);border-style:solid}
  .keyNote{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted);margin-top:12px;text-align:center}
  .keyNote b{color:var(--brand)}
  /* the bottom tab bar — each button is a page */
  .tabBar{display:flex;gap:6px;margin-top:30px;padding-top:18px;border-top:1px solid var(--border)}
  .tab{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .tab:hover{color:#fff;border-color:var(--muted)}
  .tab.on{color:#04140d;background:var(--brand);border-color:var(--brand)}
  .starterTag{width:max-content;max-width:92%;margin:0 auto 20px;padding:6px 14px;border:1px solid rgba(110,231,183,.25);border-radius:999px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#84848c;text-align:center}
  .starterTag,.starterTag *{line-height:1.6}

  /* ── subs, enriched: renewal countdown, alerts, a "coming up" radar,
        a text-paste importer, and a cancel-win toast ── */
  .subAlerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .subAl{display:flex;align-items:center;gap:10px;border:1px solid rgba(110,231,183,.24);background:rgba(110,231,183,.05);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4}
  .subAl .tag{flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#04140d;background:var(--brand);border-radius:999px;padding:3px 8px}
  .subAl b{color:var(--fg)}
  .radarBox{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .radarTop{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .radarTop b{color:var(--brand);font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:12px}
  .rBrow{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:10px;padding:8px 0 0}
  .rBrow+.rBrow{border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .rDot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
  .rDot.soon{background:var(--brand)}
  .rDot.imminent{background:#f5cf7a;box-shadow:0 0 8px rgba(245,207,122,.6)}
  .rNm{font-size:13px}
  .rWhen{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
  .rAmt{font-family:var(--mono);font-size:12px;color:var(--muted-strong)}
  .row .subMeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px}
  .subRenew{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .subRenew.urgent{color:#f5cf7a}
  .subTrial{font-family:var(--mono);font-size:9.5px;color:#f5cf7a}
  .subEdit{grid-column:1/-1;margin-top:0;padding-top:0;border-top:none;display:none;max-height:0;overflow:hidden}
  .row.editingSub .subEdit{display:block;max-height:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .subEdit .eGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .subEdit input{background:rgba(14,14,17,.7);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--fg);font:inherit;font-size:12.5px;outline:none;min-width:0;width:100%}
  .subEdit input:focus{border-color:var(--brand)}
  .subEdit .eLbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
  .subEdit .eLbl:first-child{margin-top:0}
  .subEdit .eSeg{display:flex;gap:5px}
  .subEdit .eSeg button{flex:1;background:none;border:1px solid var(--border);color:var(--muted);font:inherit;font-size:11px;padding:7px;border-radius:8px;cursor:pointer}
  .subEdit .eSeg button.on{background:var(--brand);color:#04140d;border-color:var(--brand)}
  .subEdit .eActs{display:flex;gap:8px;margin-top:10px}
  .subEdit .eSave{flex:1;background:var(--brand);color:#04140d;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px;cursor:pointer}
  .subEdit .eCancel{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:9px 12px;font-size:12.5px;cursor:pointer}
  .subActs{display:flex;align-items:center;gap:2px}
  .row .edit2{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;opacity:.55;padding:2px 4px;transition:opacity .12s,color .12s}
  .row .edit2:hover{opacity:1;color:var(--brand)}
  .row .del.confirm{opacity:1;color:var(--neg);font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,139,139,.4);border-radius:999px;padding:3px 7px}
  .pasteBtn{display:block;margin:0 auto 16px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font:inherit;font-size:12px;padding:9px 14px;cursor:pointer;transition:color .14s,border-color .14s}
  .pasteBtn:hover{color:var(--brand);border-color:var(--brand)}
  .finVeil{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
  .finVeil.on{opacity:1;pointer-events:auto}
  .finSheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#0b0b0e;border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;max-width:600px;margin:0 auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .4s var(--ease);max-height:80vh;overflow-y:auto}
  .finSheet.on{transform:none}
  .finSheet .grab{width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,.14);margin:0 auto 16px}
  .finSheet h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:22px;margin-bottom:4px}
  .finSheet .sub2{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .pasteArea{width:100%;min-height:110px;background:rgba(14,14,17,.7);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--fg);outline:none;resize:vertical}
  .pasteArea:focus{border-color:var(--brand)}
  .pasteGo{display:block;width:100%;margin-top:12px;background:var(--brand);color:#04140d;font-weight:700;font-size:14px;border-radius:12px;padding:13px;cursor:pointer;border:none}
  .pvRow{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
  .pvRow .nm{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pvRow .amt{font-family:var(--mono);font-size:11.5px;color:var(--muted-strong)}
  .pvRow .rm{color:rgba(255,255,255,.3);padding:2px 5px;font-size:14px;cursor:pointer;background:none;border:none}
  .finToast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);z-index:95;background:#0b0b0e;border:1px solid rgba(110,231,183,.4);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px -8px rgba(0,0,0,.8);transition:transform .45s var(--ease);max-width:90vw}
  .finToast.on{transform:translateX(-50%) translateY(0)}
  .finToast .t1{font-size:13px;font-weight:600}
  .finToast .t1 b{color:var(--brand)}
  .finToast .t2{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
  @media (prefers-reduced-motion: reduce){ .finVeil,.finSheet,.finToast{transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="shell">
<div class="starterTag">✦ starter — the value is what you build · the videos show how</div>
  <h1>Finance</h1>
  <div class="well" id="app"></div>
</div>

<div class="finVeil" id="finVeil"></div>
<div class="finSheet" id="finSheet">
  <div class="grab"></div>
  <h3>Bring a bill in</h3>
  <p class="sub2">Paste anything billing-shaped, one subscription per line — "Netflix $15.99/month" works. Re-paste a statement later and a price that quietly went up gets caught automatically.</p>
  <textarea class="pasteArea" id="pasteIn" placeholder="Netflix $15.99/month&#10;Spotify Premium 11.99 monthly&#10;Adobe CC - 263.88 per year"></textarea>
  <button class="pasteGo" id="pasteGo">Read it</button>
  <div id="pvBox"></div>
</div>
<div class="finToast" id="finToast">
  <div><div class="t1" id="finToastT1"></div><div class="t2" id="finToastT2"></div></div>
</div>

<script>
let store={};let view='networth';
let editingId=null;let editKind='bal';let adding=false;let addingStock=false;let addingSub=false;
let editingSubId=null;let confirmSubId=null;let pvItems=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fetchingS=new Set();let finNote=false;
function persist(){window.Vitality.save(store)}
function accts(){if(!Array.isArray(store.accounts))store.accounts=[];return store.accounts}
function holds(){if(!Array.isArray(store.holdings))store.holdings=[];return store.holdings}
function subs(){if(!Array.isArray(store.subs))store.subs=[];return store.subs}
function hist(){if(!Array.isArray(store.history))store.history=[];return store.history}
function holdValue(h){return (typeof h.shares==='number'?h.shares:0)*(typeof h.price==='number'?h.price:0)}
function stockTotal(){return holds().reduce((s,h)=>s+holdValue(h),0)}
/* period-aware monthly cost — old subs (no .period) fall through to the
   original flat-amount behavior, so nothing already saved changes value. */
function monthlyEquiv(s){const a=typeof s.amount==='number'?s.amount:0;return s.period==='yearly'?a/12:s.period==='weekly'?a*52/12:a;}
function monthlyBurn(){return subs().reduce((s,x)=>s+monthlyEquiv(x),0)}

/* ── renewal date math, ported from the radar's engine ── */
const FIN_DAY=86400000;
const finStartOfToday=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function finParseLocalDate(iso){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null;
  const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return isNaN(dt)?null:dt;
}
function finNextRenewal(iso,period){
  const d=finParseLocalDate(iso);if(!d)return null;
  const today=finStartOfToday();let safety=0;
  while(d<today&&safety++<600){
    if(period==='weekly')d.setDate(d.getDate()+7);
    else if(period==='yearly')d.setFullYear(d.getFullYear()+1);
    else d.setMonth(d.getMonth()+1);
  }
  return d;
}
const finDaysTo=date=>Math.round((new Date(date.getFullYear(),date.getMonth(),date.getDate())-finStartOfToday())/FIN_DAY);
function finWhenLabel(n){return n===0?'today':n===1?'tomorrow':'in '+n+'d'}
function finDateLabel(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function normalizeUrl(raw){
  const t=(raw||'').trim();if(!t)return null;
  const w=/^https?:\/\//i.test(t)?t:'https://'+t;
  try{const u=new URL(w);return (u.protocol==='http:'||u.protocol==='https:')?u.toString():null}catch(e){return null}
}
function netWorth(){let s=0;for(const a of accts())s+=(typeof a.balance==='number'?a.balance:0);for(const h of holds())s+=holdValue(h);return s;}
function fmtMoney(n){if(n==null)return '—';const sign=n<0?'−':'';const a=Math.abs(n);
  return sign+'$'+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?Math.round(a).toLocaleString():a.toLocaleString(undefined,{maximumFractionDigits:0}));}

function snapshot(){
  const v=netWorth(),h=hist(),now=Date.now(),prev=h[h.length-1];
  if(prev&&prev.value===v)return;
  if(prev&&now-prev.t<120000){prev.t=now;prev.value=v;}
  else h.push({t:now,value:v});
}

async function refreshStock(h){
  const V=window.Vitality||{};
  if(!h.symbol||!V.stock)return;
  if(fetchingS.has(h.id))return;
  fetchingS.add(h.id);render();
  try{const price=await V.stock(h.symbol);if(typeof price==='number'&&price>0){h.price=price;snapshot();persist();}}
  catch(e){if(String(e&&e.message||'')==='no_key')finNote=true;}
  finally{fetchingS.delete(h.id);render();}
}

function graph(){
  const h=hist().filter(s=>typeof s.value==='number');
  if(h.length<2)return '<div class="gEmpty">add accounts or stocks and the <b>net-worth line draws itself</b> over time</div>';
  const W=560,H=120,P=8;
  const t0=h[0].t,t1=h[h.length-1].t||t0+1;
  const lo=Math.min(...h.map(s=>s.value)),hi=Math.max(...h.map(s=>s.value));
  const x=t=>P+((t-t0)/Math.max(1,t1-t0))*(W-2*P);
  const y=v=>hi===lo?H/2:P+(1-(v-lo)/(hi-lo))*(H-2*P);
  const pts=h.map(s=>[x(s.t),y(s.value)]);
  let d='M '+pts[0][0]+' '+pts[0][1];
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=' C '+(p1[0]+(p2[0]-p0[0])/6)+' '+(p1[1]+(p2[1]-p0[1])/6)+', '+(p2[0]-(p3[0]-p1[0])/6)+' '+(p2[1]-(p3[1]-p1[1])/6)+', '+p2[0]+' '+p2[1];}
  const area=d+' L '+pts[pts.length-1][0]+' '+(H-P)+' L '+pts[0][0]+' '+(H-P)+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" preserveAspectRatio="none">'
    +'<defs><linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6EE7B7" stop-opacity=".26"/><stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#fg1)"/><path d="'+d+'" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4" fill="#6EE7B7"/></svg>';
}

/* one row's editable value cell (inline input when this id is being edited) */
function valCell(id,kind,val,neg){
  if(editingId===id)return '<input class="balIn" id="editIn" type="text" inputmode="decimal" value="'+(val===''?'':val)+'" autocomplete="off"/>';
  return '<span class="bal'+(neg?' neg':'')+'" data-'+kind+'="'+id+'" title="Tap to edit">';
}

function listAccounts(){
  let h='';
  for(const ac of accts()){
    const neg=typeof ac.balance==='number'&&ac.balance<0;
    h+='<div class="row"><div class="nmwrap"><span class="nm">'+esc(ac.name)+'</span></div>'
      +valCell(ac.id,'bal',(typeof ac.balance==='number'?ac.balance:''),neg)+(editingId===ac.id?'':fmtMoney(typeof ac.balance==='number'?ac.balance:0)+'</span>')
      +'<button class="del" data-del="'+ac.id+'" title="Remove">&times;</button></div>';
  }
  if(adding)h+='<div class="addRow"><input id="nmIn" placeholder="account name" autocomplete="off"/><input id="amtIn" type="text" inputmode="decimal" placeholder="balance" autocomplete="off"/><button data-add>Add</button></div>';
  else h+='<button class="addBtn" data-addtoggle>+ Add account</button>';
  return h;
}
function listStocks(){
  let h='';
  for(const hd of holds()){
    const px=typeof hd.price==='number'?hd.price:null;
    const sub=(typeof hd.shares==='number'?hd.shares:0)+' sh'+(px!=null?' @ '+fmtMoney(px):' · '+(fetchingS.has(hd.id)?'pricing…':'add a key to price'));
    h+='<div class="row"><div class="nmwrap"><span class="nm">'+esc(hd.symbol)+'</span><div class="hsub">'+sub+'</div></div>'
      +valCell(hd.id,'sh',(typeof hd.shares==='number'?hd.shares:''),false)+(editingId===hd.id?'':(fetchingS.has(hd.id)?'…':fmtMoney(holdValue(hd)))+'</span>')
      +'<button class="del" data-del="'+hd.id+'" title="Remove">&times;</button></div>';
  }
  if(addingStock)h+='<div class="addRow stock"><input id="symIn" placeholder="ticker — e.g. AAPL" autocomplete="off"/><input id="shIn" type="text" inputmode="decimal" placeholder="shares" autocomplete="off"/><button data-addstockgo>Add</button></div>';
  else h+='<button class="addBtn" data-addstock>+ Add stock</button>';
  if(finNote)h+='<div class="keyNote">stocks need a free <b>Finnhub key</b> in .env.local — your mentor sets it up. Until then they hold at $0.</div>';
  return h;
}
function subEditPanel(sb){
  return '<div class="eLbl">Billed</div><div class="eSeg" data-eperiod="'+sb.id+'">'
    +['monthly','yearly','weekly'].map(p=>'<button data-p="'+p+'" class="'+((sb.period||'monthly')===p?'on':'')+'">'+p+'</button>').join('')
    +'</div>'
    +'<div class="eGrid" style="margin-top:8px">'
    +'<div><div class="eLbl">Next renewal</div><input type="date" data-erenewal="'+sb.id+'" value="'+(sb.renewal||'')+'"></div>'
    +'<div><div class="eLbl">Trial ends</div><input type="date" data-etrial="'+sb.id+'" value="'+(sb.trialEnds||'')+'"></div>'
    +'</div>'
    +'<div class="eLbl">Manage / billing link</div><input data-emanage="'+sb.id+'" value="'+esc(sb.manageUrl||'')+'" placeholder="netflix.com/account">'
    +'<div class="eActs"><button class="eSave" data-esave="'+sb.id+'">Save</button><button class="eCancel" data-ecancel>Close</button></div>';
}
function listSubs(){
  let h='';
  for(const sb of subs()){
    const nx=sb.renewal?finNextRenewal(sb.renewal,sb.period||'monthly'):null;
    const rn=nx?finDaysTo(nx):null;
    const urgent=rn!=null&&rn<=5;
    const trialN=sb.trialEnds?finDaysTo(finParseLocalDate(sb.trialEnds)):null;
    h+='<div class="row'+(editingSubId===sb.id?' editingSub':'')+'"><div class="nmwrap"><span class="nm">'+esc(sb.name)+'</span>'
      +'<div class="subMeta"><span class="hsub">'+(sb.period||'monthly')+'</span>'
      +(nx?'<span class="subRenew'+(urgent?' urgent':'')+'">↻ '+(rn<0?'past due':finWhenLabel(rn))+'</span>':'')
      +(trialN!=null&&trialN>=0?'<span class="subTrial">trial ends '+finWhenLabel(trialN)+'</span>':'')
      +'</div></div>'
      +'<span class="bal" data-subedit="'+sb.id+'" title="Edit details">'+fmtMoney(monthlyEquiv(sb))+'/mo</span>'
      +'<div class="subActs"><button class="edit2" data-subedit="'+sb.id+'" title="Edit details">&#9998;</button>'
      +(confirmSubId===sb.id?'<button class="del confirm" data-subdel="'+sb.id+'">sure?</button>':'<button class="del" data-subask="'+sb.id+'" title="Remove">&times;</button>')
      +'</div>'
      +'<div class="subEdit">'+subEditPanel(sb)+'</div>'
      +'</div>';
  }
  if(addingSub)h+='<div class="addRow"><input id="subNmIn" placeholder="subscription — e.g. Netflix" autocomplete="off"/><input id="subAmtIn" type="text" inputmode="decimal" placeholder="$ / month" autocomplete="off"/><button data-addsubgo>Add</button></div>';
  else h+='<button class="addBtn" data-addsub>+ Add subscription</button>';
  return h;
}
function subAlerts(){
  const als=[];
  for(const sb of subs()){
    const t=sb.trialEnds?finParseLocalDate(sb.trialEnds):null;
    if(t){const n=finDaysTo(t);if(n>=0&&n<=14)als.push({kind:'trial',sb,n});}
    if(sb.prevAmount!=null&&sb.amount>sb.prevAmount+.005&&(!sb.priceChangedAt||Date.now()-sb.priceChangedAt<=60*FIN_DAY))
      als.push({kind:'hike',sb});
  }
  if(!als.length)return '';
  als.sort((a,b)=>a.kind!==b.kind?(a.kind==='trial'?-1:1):(a.n||0)-(b.n||0));
  return '<div class="subAlerts">'+als.map(a=>a.kind==='trial'
    ?'<div class="subAl"><span class="tag">trial</span><span>'+esc(a.sb.name)+' free trial ends <b>'+finWhenLabel(a.n)+'</b> — cancel before it charges</span></div>'
    :'<div class="subAl"><span class="tag">price up</span><span>'+esc(a.sb.name)+' went up '+fmtMoney(a.sb.prevAmount)+' → <b>'+fmtMoney(a.sb.amount)+'</b></span></div>'
  ).join('')+'</div>';
}
function radarBox(){
  const bills=subs().map(sb=>{ if(!sb.renewal)return null; const nx=finNextRenewal(sb.renewal,sb.period||'monthly'); if(!nx)return null; return {sb,nx,n:finDaysTo(nx)}; })
    .filter(b=>b&&b.n>=0&&b.n<=30).sort((a,b)=>a.n-b.n);
  if(!bills.length)return '';
  const tot=bills.reduce((t,b)=>t+(typeof b.sb.amount==='number'?b.sb.amount:0),0);
  return '<div class="radarBox"><div class="radarTop"><span>coming up</span><b>'+fmtMoney(tot)+' next 30 days</b></div>'
    +bills.map(b=>{const tone=b.n<=3?'imminent':b.n<=7?'soon':'';
      return '<div class="rBrow"><span class="rDot '+tone+'"></span><div><div class="rNm">'+esc(b.sb.name)+'</div><div class="rWhen">'+finWhenLabel(b.n)+' · '+finDateLabel(b.nx)+'</div></div><span class="rAmt">'+fmtMoney(b.sb.amount)+'</span></div>';
    }).join('')+'</div>';
}
let subToastTimer;
function subCancelWin(sb){
  const m=monthlyEquiv(sb);
  const t1=document.getElementById('finToastT1'),t2=document.getElementById('finToastT2'),toast=document.getElementById('finToast');
  if(!t1||!toast)return;
  t1.innerHTML='Canceled '+esc(sb.name)+' · <b>+'+fmtMoney(m)+'/mo</b> back';
  t2.textContent='that is '+fmtMoney(m*12)+' a year';
  toast.classList.add('on');
  clearTimeout(subToastTimer);
  subToastTimer=setTimeout(()=>toast.classList.remove('on'),3600);
}

/* ── paste importer: deterministic text parsing only. No OCR/image scan here
   — that needs an external CDN library, and a sealed tile can't fetch. ── */
function openPasteSheet(){
  document.getElementById('finVeil').classList.add('on');
  document.getElementById('finSheet').classList.add('on');
  document.getElementById('pasteIn').value=''; document.getElementById('pvBox').innerHTML=''; pvItems=[];
  setTimeout(()=>{const p=document.getElementById('pasteIn'); if(p)p.focus();},300);
}
function closePasteSheet(){
  document.getElementById('finVeil').classList.remove('on');
  document.getElementById('finSheet').classList.remove('on');
}
const FIN_PERIOD_WORDS=[[/per\s*year|yearly|annual|\/\s*y(ea)?r|a\s*year/i,'yearly'],[/per\s*week|weekly|\/\s*w(ee)?k|a\s*week/i,'weekly'],[/per\s*month|monthly|\/\s*mo(nth)?|a\s*month/i,'monthly']];
function parseBillText(text){
  const out=[];
  for(const lineRaw of text.split(/\n+/)){
    const line=lineRaw.trim(); if(!line)continue;
    const m=line.match(/(?:[$€£]|CHF|USD|EUR|GBP)?\s*(\d{1,3}(?:[ ,]\d{3})*(?:[.,]\d{1,2})?)(?!\d)/);
    if(!m)continue;
    const amount=parseFloat(m[1].replace(/[ ,](?=\d{3}\b)/g,'').replace(',','.'));
    if(!isFinite(amount)||amount<=0)continue;
    let period='monthly';
    for(const pair of FIN_PERIOD_WORDS){ if(pair[0].test(line)){ period=pair[1]; break; } }
    let name=line.slice(0,m.index).replace(/[-–—·:|]+\s*$/,'').trim();
    if(!name)name=line.slice(m.index+m[0].length).replace(/^[-–—·:|]+\s*/,'').replace(/(per|a)\s*(year|month|week)|yearly|monthly|weekly|annual/ig,'').trim();
    if(!name)continue;
    if(name.length>42)name=name.slice(0,42).trim();
    out.push({name,amount,period});
  }
  return out;
}
function paintPv(){
  const box=document.getElementById('pvBox');
  if(!pvItems.length){ box.innerHTML='<p style="font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13.5px;margin-top:10px">Could not read a price on any line. Try one per line, like: Netflix $15.99/month</p>'; return; }
  box.innerHTML=pvItems.map((p,i)=>'<div class="pvRow"><span class="nm">'+esc(p.name)+'</span><span class="amt">'+fmtMoney(p.amount)+' / '+p.period+'</span><button class="rm" data-pvrm="'+i+'">&times;</button></div>').join('')
    +'<button class="pasteGo" data-pvaddall style="margin-top:12px">Add '+pvItems.length+' subscription'+(pvItems.length>1?'s':'')+'</button>';
}
function runPasteReview(){ pvItems=parseBillText(document.getElementById('pasteIn').value); paintPv(); }

function tabBar(){
  return '<div class="tabBar">'+[['networth','Net worth'],['stocks','Stocks'],['subs','Subs']]
    .map(t=>'<button class="tab'+(view===t[0]?' on':'')+'" data-view="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
}

function render(){
  let html='';
  if(view==='networth'){
    const any=accts().length||holds().length,v=any?netWorth():null,h=hist();
    let delta='';
    if(h.length>=2){const d=h[h.length-1].value-h[0].value,up=d>=0;delta='<div class="delta">since day one · <b class="'+(up?'':'down')+'">'+(up?'▲ ':'▼ ')+fmtMoney(Math.abs(d)).replace('−','')+'</b></div>';}
    html='<div class="kick">✦ net worth</div><div class="worth'+(v!=null&&v<0?' neg':'')+'">'+fmtMoney(v)+'</div>'+delta
      +'<div class="gwrap">'+graph()+'</div><div class="list">'+listAccounts()+'</div>';
  }else if(view==='stocks'){
    html='<div class="kick">✦ holdings</div><div class="worth">'+(holds().length?fmtMoney(stockTotal()):'—')+'</div>'
      +(holds().length?'<div class="delta">'+holds().length+' position'+(holds().length===1?'':'s')+' · live-priced</div>':'')
      +'<div class="list" style="margin-top:24px">'+listStocks()+'</div>';
  }else{
    html='<div class="kick">✦ monthly burn</div><div class="worth">'+(subs().length?fmtMoney(monthlyBurn())+'<span class="u">/mo</span>':'—')+'</div>'
      +(subs().length?'<div class="delta">'+subs().length+' renewal'+(subs().length===1?'':'s')+' a month</div>':'')
      +'<div class="list" style="margin-top:24px">'+subAlerts()+radarBox()+'<button class="pasteBtn" data-pasteopen>+ paste a bill instead</button>'+listSubs()+'</div>';
  }
  html+=tabBar();
  document.getElementById('app').innerHTML=html;
  if(editingId){const i=document.getElementById('editIn');if(i){i.focus();try{i.select();}catch(e){}
    i.addEventListener('keydown',e=>{if(e.key==='Enter')commit();else if(e.key==='Escape'){editingId=null;render();}});
    i.addEventListener('blur',commit);}}
  if(adding){const n=document.getElementById('nmIn');if(n)n.focus();const amt=document.getElementById('amtIn');if(amt)amt.addEventListener('keydown',e=>{if(e.key==='Enter')addAccount()});}
  if(addingStock){const s=document.getElementById('symIn');if(s)s.focus();const sh=document.getElementById('shIn');if(sh)sh.addEventListener('keydown',e=>{if(e.key==='Enter')addStock()});}
  if(addingSub){const n=document.getElementById('subNmIn');if(n)n.focus();const amt=document.getElementById('subAmtIn');if(amt)amt.addEventListener('keydown',e=>{if(e.key==='Enter')addSub()});}
}

function commit(){
  const i=document.getElementById('editIn');if(!i||!editingId)return;
  const raw=String(i.value).replace(/[$,\s]/g,'');const n=Number(raw);
  if(editKind==='sh'){
    const hd=holds().find(x=>x.id===editingId);editingId=null;
    if(hd&&raw!==''&&isFinite(n)&&n>=0){hd.shares=n;snapshot();persist();render();refreshStock(hd);return;}
  }else if(editKind==='sub'){
    const sb=subs().find(x=>x.id===editingId);
    if(sb&&raw!==''&&isFinite(n)&&n>=0){
      if(n>sb.amount+.005){ sb.prevAmount=sb.amount; sb.priceChangedAt=Date.now(); }
      sb.amount=n;persist();
    }
  }else{
    const ac=accts().find(x=>x.id===editingId);if(ac&&raw!==''&&isFinite(n)){ac.balance=n;snapshot();persist();}
  }
  editingId=null;render();
}
function addAccount(){
  const n=document.getElementById('nmIn'),amt=document.getElementById('amtIn');
  const name=(n?n.value:'').trim();if(!name){if(n)n.focus();return;}
  const raw=String(amt?amt.value:'').replace(/[$,\s]/g,'');const bal=Number(raw);
  accts().push({id:'a'+Math.random().toString(36).slice(2,8),name,balance:(raw!==''&&isFinite(bal))?bal:0});
  adding=false;snapshot();persist();render();
}
function addStock(){
  const s=document.getElementById('symIn'),sh=document.getElementById('shIn');
  const symbol=(s?s.value:'').trim().toUpperCase();if(!symbol){if(s)s.focus();return;}
  const raw=String(sh?sh.value:'').replace(/[,\s]/g,'');const shares=Number(raw);
  const hd={id:'h'+Math.random().toString(36).slice(2,8),symbol,shares:(raw!==''&&isFinite(shares))?shares:0,price:null};
  holds().push(hd);addingStock=false;persist();render();refreshStock(hd);
}
function addSub(){
  const n=document.getElementById('subNmIn'),amt=document.getElementById('subAmtIn');
  const name=(n?n.value:'').trim();if(!name){if(n)n.focus();return;}
  const raw=String(amt?amt.value:'').replace(/[$,\s]/g,'');const amount=Number(raw);
  subs().push({id:'s'+Math.random().toString(36).slice(2,8),name,amount:(raw!==''&&isFinite(amount))?amount:0,
    period:'monthly',renewal:null,trialEnds:null,manageUrl:null,prevAmount:null,priceChangedAt:null});
  addingSub=false;persist();render();
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-view]');
  if(tab){view=tab.getAttribute('data-view');editingId=null;adding=addingStock=addingSub=false;editingSubId=null;confirmSubId=null;render();return}
  const b=e.target.closest('[data-bal]');
  if(b){editingId=b.getAttribute('data-bal');editKind='bal';adding=addingStock=addingSub=false;render();return}
  const sh=e.target.closest('[data-sh]');
  if(sh){editingId=sh.getAttribute('data-sh');editKind='sh';adding=addingStock=addingSub=false;render();return}
  const su=e.target.closest('[data-sub]');
  if(su){editingId=su.getAttribute('data-sub');editKind='sub';adding=addingStock=addingSub=false;render();return}
  const d=e.target.closest('[data-del]');
  if(d){const id=d.getAttribute('data-del');store.accounts=accts().filter(x=>x.id!==id);store.holdings=holds().filter(x=>x.id!==id);store.subs=subs().filter(x=>x.id!==id);snapshot();persist();render();return}
  if(e.target.closest('[data-addtoggle]')){adding=true;editingId=null;render();return}
  if(e.target.closest('[data-addstock]')){addingStock=true;editingId=null;render();return}
  if(e.target.closest('[data-addsub]')){addingSub=true;editingId=null;render();return}
  if(e.target.closest('[data-add]')){addAccount();return}
  if(e.target.closest('[data-addstockgo]')){addStock();return}
  if(e.target.closest('[data-addsubgo]')){addSub();return}

  const se=e.target.closest('[data-subedit]');
  if(se){const id=se.getAttribute('data-subedit');editingSubId=(editingSubId===id)?null:id;confirmSubId=null;render();return}
  if(e.target.closest('[data-ecancel]')){editingSubId=null;render();return}
  const eseg=e.target.closest('[data-eperiod] button');
  if(eseg){const id=eseg.closest('[data-eperiod]').getAttribute('data-eperiod');const sb=subs().find(x=>x.id===id);if(sb){sb.period=eseg.getAttribute('data-p');persist();render();}return}
  const esave=e.target.closest('[data-esave]');
  if(esave){
    const id=esave.getAttribute('data-esave'),sb=subs().find(x=>x.id===id),panel=esave.closest('.subEdit');
    if(sb&&panel){
      const ren=panel.querySelector('[data-erenewal]'),tr=panel.querySelector('[data-etrial]'),mg=panel.querySelector('[data-emanage]');
      sb.renewal=ren&&ren.value?ren.value:null;
      sb.trialEnds=tr&&tr.value?tr.value:null;
      sb.manageUrl=mg&&mg.value.trim()?normalizeUrl(mg.value.trim()):null;
      persist();
    }
    editingSubId=null;render();return
  }
  const suask=e.target.closest('[data-subask]');
  if(suask){const id=suask.getAttribute('data-subask');confirmSubId=id;render();setTimeout(()=>{if(confirmSubId===id){confirmSubId=null;render();}},3200);return}
  const sudel=e.target.closest('[data-subdel]');
  if(sudel){
    const id=sudel.getAttribute('data-subdel'),i=subs().findIndex(x=>x.id===id);
    if(i>-1){const sb=subs()[i];subs().splice(i,1);confirmSubId=null;persist();render();subCancelWin(sb);}
    return
  }
  if(e.target.closest('[data-pasteopen]')){openPasteSheet();return}
  if(e.target.closest('#finVeil')){closePasteSheet();return}
  if(e.target.closest('#pasteGo')){runPasteReview();return}
  const pvrm=e.target.closest('[data-pvrm]');
  if(pvrm){pvItems.splice(+pvrm.getAttribute('data-pvrm'),1);paintPv();return}
  if(e.target.closest('[data-pvaddall]')){
    for(const p of pvItems){
      const existing=subs().find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
      if(existing){
        if(p.amount>existing.amount+.005){existing.prevAmount=existing.amount;existing.priceChangedAt=Date.now();}
        existing.amount=p.amount;existing.period=p.period;
      }else{
        subs().push({id:'s'+Math.random().toString(36).slice(2,8),name:p.name,amount:p.amount,period:p.period,renewal:null,trialEnds:null,manageUrl:null,prevAmount:null,priceChangedAt:null});
      }
    }
    persist();closePasteSheet();render();
    return
  }
});

/* standalone preview: opened as a raw file with no dashboard bridge? back it
   with localStorage so it still renders. In the real sealed dashboard the
   bridge is injected first, so this branch never runs there. */
if(!window.Vitality){window.Vitality={save:function(d){try{localStorage.setItem('v:prev:finance',JSON.stringify(d));}catch(e){}return Promise.resolve(true);},load:function(){try{return Promise.resolve(JSON.parse(localStorage.getItem('v:prev:finance')||'{}'));}catch(e){return Promise.resolve({});}},read:function(){return Promise.resolve(null);},stock:function(){return Promise.reject(new Error('no_key'));}};}
(async()=>{
  const d=await window.Vitality.load();
  store=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  if(!Array.isArray(store.accounts))store.accounts=[];
  if(!Array.isArray(store.holdings))store.holdings=[];
  if(!Array.isArray(store.subs))store.subs=[];
  if(!Array.isArray(store.history))store.history=[];
  render();
  for(const hd of holds()){ if(!hd.symbol)continue; await refreshStock(hd); await new Promise(r=>setTimeout(r,1200)); }
})();
